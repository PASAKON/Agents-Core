<!doctype html>
<meta charset="utf-8">
<title>บ้านนี้มีมีมี่ — EP cover 1080x1920</title>
<!--
  Reels cover for «บ้านนี้มีมีมี่». Render: cover.html?img=A|B|C[&l1=...&l2=...&ep=1]
  Same L3 child-handwriting treatment as docs/reports/khaoniao-family-style/logo/logo.html (code wins over wiki):
    Itim, fill #FFF6D6, stroke #203A5E (paint-order stroke), grapheme-by-grapheme wobble, wave underline.
  Accent gold #F2B632 = the profile ring of P3. Dark navy shade rgba(8,16,32,..) = the logo's cover shade.
  The picture is a real frame cut from the episode (never an image model: it garbles Thai and invents hex).
  Icons are inline SVG, no emoji. Real Thai fonts (Google Fonts, SIL OFL).
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&display=block');
html,body{margin:0;padding:0;background:#10203a;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Itim'}
.pic{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;left:0;right:0;bottom:0;height:1000px;background:linear-gradient(180deg,rgba(8,16,32,0) 0%,rgba(8,16,32,.62) 45%,rgba(8,16,32,.88) 100%)}
.top{position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(180deg,rgba(8,16,32,.5) 0%,rgba(8,16,32,0) 100%)}
.line{position:absolute;left:0;right:0;display:flex;justify-content:center}
.t{display:inline-block;white-space:nowrap;line-height:1.25;transform-origin:center center;
   -webkit-text-stroke:16px #203A5E;paint-order:stroke fill;filter:drop-shadow(0 7px 6px rgba(0,0,0,.5))}
.ch{display:inline-block}
.l1 .t{font-size:150px;color:#FFF6D6}
.l2 .t{font-size:150px;color:#F2B632}
.wave{position:absolute;left:140px;width:800px;height:30px}
.badge{position:absolute;left:56px;top:96px;width:176px;height:176px;border-radius:50%;background:#F2B632;
  box-shadow:inset 0 0 0 10px #FFF3D6,0 8px 14px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#203A5E;line-height:1}
.badge b{font-size:78px;font-weight:400}.badge i{font-style:normal;font-size:30px;margin-top:4px}
.mark{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;width:620px}
</style>
<div id="stage">
  <div class="pic" id="pic"></div><div class="top"></div><div class="shade"></div>
  <div class="badge"><b id="ep">EP.1</b><i>ตอนแรก</i></div>
  <div class="line l1" id="l1"></div><div class="line l2" id="l2"></div>
  <svg class="wave" id="wave" viewBox="0 0 800 30"><path d="M8 16 q25 -16 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" stroke="#FFF6D6" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  <img class="mark" id="mark" src="file:///C:/mooniex/khaoniao/cover/logo-3-mark.png">
</div>
<script>
const q = new URLSearchParams(location.search);
const L1 = q.get('l1') || 'ทำไมมีมี่กลัวน้ำ', L2 = q.get('l2') || 'แต่ยอมลุยน้ำท่วม?';
const IMG = q.get('img') || 'A', TOP = +(q.get('top') || 1090), FIT = +(q.get('fit') || 940);
document.getElementById('pic').style.backgroundImage = `url(file:///C:/mooniex/khaoniao/cover/${IMG}.png)`;
document.getElementById('ep').textContent = 'EP.' + (q.get('ep') || '1');
const rot = [-5, 4, -3, 5, -4, 3, -5], dy = [0, -8, 4, -6, 6, -4, 2];
const clusters = s => [...new Intl.Segmenter('th', {granularity: 'grapheme'}).segment(s)].map(x => x.segment);
const spans = s => clusters(s).map((c, i) => `<span class="ch" style="transform:translateY(${dy[i % 7] * .8}px) rotate(${rot[i % 7] * .8}deg)">${c}</span>`).join('');
async function build() {
  for (const [id, txt, y] of [['l1', L1, TOP], ['l2', L2, TOP + 200]]) {
    const el = document.getElementById(id); el.style.top = y + 'px';
    el.innerHTML = `<span class="t">${spans(txt)}</span>`;
  }
  await document.fonts.ready;
  await document.fonts.load('40px "Itim"', L1 + L2 + 'EP.1ตอนแรก');
  for (const id of ['l1', 'l2']) {
    const t = document.querySelector('#' + id + ' .t'); const w = t.getBoundingClientRect().width;
    t.style.transform = `scale(${Math.min(1, FIT / w)})`;
  }
  document.getElementById('wave').style.top = (TOP + 410) + 'px';
  document.title = 'ready';
}
build();
</script>
