  - text: "WikiFX ระบุว่าตำรวจไต้หวันได้รับเรื่องร้องเรียนกรณี BingX ขโมยและยักยอกเงินลูกค้า"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: null
  - text: "รูปแบบร้องเรียนที่ WikiFX บันทึกซ้ำๆ คือบัญชีถูกจำกัดการถอนเงินหลังทำกำไรได้"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: 2026-10-23
  - text: "BingX ก่อตั้งปี 2018 ตั้งสำนักงานอยู่ที่เซเชลส์"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: null
  - text: "BingX เปิดเลเวอเรจสูงถึง 1:125 สำหรับเทรด futures"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: 2026-10-23
  - text: "BingX ฝากขั้นต่ำเพียง 1 USDT"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: 2026-10-23
  - text: "ใบอนุญาตของแต่ละหน่วยงานตรวจสอบคนละเรื่องกัน บางใบตรวจแค่การจดทะเบียนบริษัท ไม่ได้ตรวจความปลอดภัยของเงินลูกค้า"
    source: null
    status: opinion
    valid_until: null

cta:
