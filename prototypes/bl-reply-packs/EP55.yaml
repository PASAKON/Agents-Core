episode: EP55
title: "ชื่อดังไม่ได้แปลว่ามีใบอนุญาต"
video_id: null

summary:
  - "เอพิโสดนี้อ้างอิงบทความ WikiFX เรื่อง BingX — ชื่อดังในโลกคริปโต แต่ WikiFX รายงานว่าไม่พบใบอนุญาตซื้อขายฟอเร็กซ์ที่ถูกต้อง"
  - "WikiFX ให้คะแนนความน่าเชื่อถือ 1.69/10 และรายงานเคสร้องเรียนจากผู้ใช้เรื่องถอนเงินไม่ได้หลังทำกำไร รวมถึงเรื่องที่ตำรวจไต้หวันรับแจ้งความ"
  - "เอพิโสดนี้ไม่ได้บอกให้เลิกใช้หรือใช้เจ้านี้ แค่สอนวิธีเช็กใบอนุญาตเองก่อนฝากเงิน"

claims:
