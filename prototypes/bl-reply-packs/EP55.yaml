    status: attributed
    valid_until: null
  - text: "อีกเคสหนึ่งในรายงานของ WikiFX อ้างความเสียหาย 53,451.43 ดอลลาร์"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
