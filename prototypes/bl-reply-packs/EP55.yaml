    valid_until: 2026-10-23
  - text: "WikiFX ระบุว่า BingX ไม่มีการกำกับดูแลฟอเร็กซ์ที่ถูกต้อง"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
    status: attributed
    valid_until: 2026-10-23
  - text: "WikiFX ให้คะแนนความน่าเชื่อถือ BingX อยู่ที่ 1.69/10 เพราะมีข้อร้องเรียนจากลูกค้าจำนวนมากที่ยังไม่ได้รับการแก้ไข"
    source: https://www.wikifx.com/th/newsdetail/202609211084971426.html
