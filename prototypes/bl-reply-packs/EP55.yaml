  variants: [เช็คก่อนฝาก, เช็กโบรก, เช็คโบรค, เชคก่อนฝาก, check ก่อนฝาก]
  deliverable:
    title: "ลิสต์เว็บหน่วยงานกำกับ เช็กใบอนุญาตได้จริง"
