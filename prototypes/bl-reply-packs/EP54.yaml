episode: EP54
title: "Rebate เงินที่เป็นของมึง แต่มึงไม่เคยขอ"
video_id: null

summary:
  - "ทุกออเดอร์ที่เทรด มีเงินก้อนหนึ่งถูกจัดสรรไว้เป็นส่วนหนึ่งของสเปรดหรือค่าคอมอยู่แล้ว เรียกว่า Rebate"
  - "ถ้ามี IB แนะนำเข้ามา เงินก้อนนี้จ่ายให้ IB ถ้าไม่มี โบรกเก็บไว้เองทั้งหมด ราคาที่ลูกค้าจ่ายเท่าเดิมทั้งสองกรณี"
  - "เอพิโสดนี้ไม่ได้บอกให้ใช้หรือเลิกใช้โบรกไหน แค่สอนวิธีถามโบรกให้รู้ว่าเงินก้อนนี้ไปอยู่กับใคร"

claims:
  - text: "Rebate คือส่วนหนึ่งของสเปรดหรือค่าคอมมิชชั่นที่ถูกตั้งไว้ในราคาที่ลูกค้าจ่ายอยู่แล้ว ไม่ใช่ส่วนลดหรือของแถมเพิ่มเติม"
    source: null
    status: opinion
    valid_until: null
  - text: "ถ้าลูกค้าไม่มี IB แนะนำเข้ามา โบรกเก็บเงินก้อน Rebate ไว้เอง ไม่ได้คืนให้ลูกค้าและไม่ได้ทำให้ลูกค้าจ่ายถูกลง"
    source: null
    status: opinion
    valid_until: null
  - text: "ยิ่งเทรดถี่หรือใช้ล็อตใหญ่ขึ้น เงินก้อน Rebate ที่ถูกจัดสรรต่อออเดอร์ก็ยิ่งมากขึ้นตามสัดส่วน"
    source: null
    status: opinion
    valid_until: null

cta:
  keyword: เช็ครีเบต
  variants: [เช็ครีเบต, เช็คริเบท, เช็ครีเบท, เชครีเบต, check rebate, เช็ค rebate, เช็คโบรค]
  deliverable:
    title: "ลิสต์คำถามที่ถามโบรกเองได้ เรื่อง Rebate"
    text_file: EP54-rebate-questions.md
    image: EP54-card.png
  dm_message: >-
    นี่คือลิสต์คำถามที่ถามโบรกที่คุณมีบัญชีอยู่แล้วได้เลย เพื่อเช็กว่าเงิน
    Rebate ของออเดอร์คุณไปอยู่กับใคร (เนื้อหาเพื่อการศึกษา ไม่ใช่คำแนะนำ
    หรือการชักชวนลงทุน ไม่แนะนำโบรกเจ้าไหนทั้งสิ้น)
  comment_reply_dm_sent: "ขออนุญาตส่งข้อความให้ทาง Inbox นะครับ"
  comment_reply_dm_invite: >-
    ทักมาทาง Inbox แล้วพิมพ์คำว่า เช็ครีเบต ได้เลยครับ เดี๋ยวส่งลิสต์คำถาม
    ให้ทันที

faq:
  - q: "Rebate คืออะไร"
    a: >-
      เงินก้อนหนึ่งที่ถูกจัดสรรไว้เป็นส่วนหนึ่งของสเปรดหรือค่าคอมมิชชั่นในทุก
      ออเดอร์อยู่แล้ว ปกติจ่ายให้คนที่แนะนำลูกค้าเข้ามา (IB) ถ้าไม่มีคน
      แนะนำ โบรกก็เก็บไว้เอง
  - q: "MoonieX มี Rebate ให้ไหม"
    a: >-
      เอพิโสดนี้พูดถึงกลไก Rebate ในภาพรวม ไม่ได้เปิดเผยอัตราหรือเงื่อนไข
      ของช่องทางใดช่องทางหนึ่ง ถ้าอยากรู้อัตรา Rebate ของบัญชีตัวเอง
      ให้ถามโบรกที่มีบัญชีอยู่โดยตรงตามลิสต์คำถามที่ส่งให้
  - q: "ควรใช้โบรกไหนถึงจะได้ Rebate เยอะที่สุด"
    a: >-
      เอพิโสดนี้ไม่จัดอันดับหรือแนะนำโบรกเจ้าไหน สอนแค่วิธีถามเพื่อเช็กสิทธิ์
      ของบัญชีตัวเอง

