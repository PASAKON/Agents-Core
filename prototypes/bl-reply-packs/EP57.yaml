episode: EP57
title: "เว็บหาย ไม่มีใบอนุญาต"
video_id: null

summary:
  - "เอพิโสดนี้พูดถึง XXLMARKETS โบรกที่ WikiFX รายงานว่าไม่พบใบอนุญาตซื้อขายฟอเร็กซ์และไม่มีการกำกับดูแล คะแนนความน่าเชื่อถืออยู่ที่ 1.99/10"
  - "ช่องเช็กเว็บของโบรกด้วยตัวเอง พบว่าโดเมน xxlmarkets.com ไม่มีการจดทะเบียนอยู่เลยในตอนนี้ (ไม่ใช่แค่เข้าไม่ได้ชั่วคราว) ทั้งที่เคยมีประวัติจดทะเบียนย้อนหลังถึงปี 2565"
  - "เอพิโสดนี้ไม่ได้บอกให้เลิกใช้หรือใช้เจ้านี้ แค่สอนวิธีเช็กว่าเว็บและใบอนุญาตของโบรกยังเป็นของจริงอยู่ไหมก่อนฝากเงิน"

