# BLACK LIQUIDITY EP60 -- GB / Goldenburg (WikiFX) -- real-footage shot list
# Run with: python tools/bl_realfootage.py run --shots prototypes/bl60-realfootage/shots.yaml --episode bl60
#
# Sources (all public pages, no login, captured 2026-10-01 Thai time, see prototypes/bl60-script/RUNLOG.md):
#   profile = https://www.wikifx.com/th/dealer/8341918460.html  (WikiFX profile: GB, Cyprus)
#   art     = https://www.wikifx.com/th/newsdetail/202610019604717978.html (1 Oct 2026 review, licence Revoked)
#   srv     = https://www.wikifx.com/th/survey/104771d952.html (WikiFX field visit, 2019-05-31, Good)
#   exp     = https://www.wikifx.com/th/exposure/detail/202102035922794080.html (complaint, 2021-02-03)
#
# censor_profiles and the x-wikifx-hygiene hide-block are REUSED VERBATIM from
# prototypes/bl58-realfootage/shots.yaml. Additions for EP60 only:
#   broker_contact = GB's own website / email / phone
#   people         = the two named officers WikiFX lists for the related company (never in frame)
#   survey_address = the 2019 field-visit street address
# Other brokers on the profile page (clone list, "users also viewed") are hidden by selector in every crop.

censor_profiles:
  personal_data:
    - {label: "reviewer avatar + username", kind: full, avatar_heuristic: true}
  faces: []
  promo:
    - {label: "signup/register CTA (สมัคร)", kind: full, text: "สมัคร"}
    - {label: "register CTA (ลงทะเบียน)", kind: full, text: "ลงทะเบียน"}
    - {label: "download app CTA", kind: full, text: "ดาวน์โหลด"}
    - {label: "bonus/prize banner (รางวัล)", kind: full, text: "รางวัล"}
    - {label: "gift/welcome-bonus banner (ของขวัญ)", kind: full, text: "ของขวัญ"}
    - {label: "dollar bonus amount", kind: full, regex: "\\$[\\d,]{4,}"}
    - {label: "unrelated product upsell (BotBuilt)", kind: full, text: "BotBuilt"}
  broker_logo_partial:
    - label: "header logo (partial)"
      kind: partial
      selector: ".nav-logo-link, header img[alt*=logo], a[href='/'] img"
      fraction: 0.4
      side: right
      min_w: 60
  complaint_ids:
    - {label: "complainant FX id", kind: full, regex: "FX\\d{8,}"}
    - {label: "complaint COG id", kind: full, regex: "COG\\d{10,}"}
  broker_contact:
    - {label: "broker website / email / phone text (regex, exact text range)", kind: full, regex: "(https?://)?(www\\.)?goldenburg(group|funds)\\.(eu|com)\\S*|info@goldenburggroup\\.eu|\\+?357\\s?25\\s?349815"}
  complaint_user:
    - {label: "complainant avatar + username row (older exposure template, avatar heuristic misses it)", kind: full, selector: ".user"}
  people:
    - {label: "named company officer", kind: full, regex: "IVOR\\s*LEHOTAN"}
  survey_address:
    - {label: "private street address, Thai", kind: full, regex: "[0-9]+\\s*ถนน\\S*"}
    - {label: "2019 field-visit street address", kind: full, regex: "[0-9]+\\s*Siafi\\s*Street\\S*"}
    - {label: "2019 field-visit building name", kind: full, regex: "Porto\\s*Bello\\S*"}
  other_broker:
    - {label: "another broker's name in the survey text", kind: full, regex: "[Ee][Xx][Nn][Ee][Ss][Ss]"}

x-wikifx-hygiene: &wikifx_hygiene
  hide_selectors:
    - ".advertisement-list"
    - ".wiki-direct"
    - ".article-r"
    - ".head-r"
    - ".dealer-primary-jaf-new"
    - ".article-c img, .article-info img"
    - ".chrome_ctx_right"
    - ".new_chrome_down"
    - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
  hide_texts:
    - "切换"

shots:
  # -- WikiFX profile header: logo + name + score + grade
  - id: gb-header
    url: "https://www.wikifx.com/th/dealer/8341918460.html"
    action: capture
    kind: still
    covers: [HOOK-1, HOOK-4, CONTEXT-1, CONTEXT-2, MAIN-1]
    wait_ms: 2500
    crop:
      selector: ".head-l-john"
      pad: 2.4
    hide_selectors:
      - ".advertisement-list"
      - ".wiki-direct"
      - ".article-r"
      - ".head-r"
      - ".dealer-primary-jaf-new"
      - ".article-c img, .article-info img"
      - ".chrome_ctx_right"
      - ".new_chrome_down"
      - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
      - ".dealer-survey-container"
    hide_texts:
      - "切换"
    censor_profiles: [personal_data, broker_contact]
    source_note: "score badge is an odometer reel, anchored on the header container not on digits"

  # -- WikiFX profile red warning card
  - id: gb-warning
    url: "https://www.wikifx.com/th/dealer/8341918460.html"
    action: capture
    kind: still
    covers: [HOOK-2]
    wait_ms: 2500
    crop:
      selector: ".dealer-risk"
      pad: 1.0
    hide_selectors:
      - ".advertisement-list"
      - ".wiki-direct"
      - ".article-r"
      - ".head-r"
      - ".dealer-primary-jaf-new"
      - ".article-c img, .article-info img"
      - ".chrome_ctx_right"
      - ".new_chrome_down"
      - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
      - ".top-comment-item"
      - ".dealer-survey-container"
    hide_texts:
      - "切换"
    censor_profiles: [personal_data, broker_contact]
    source_note: "WikiFX's own warning card dated 2026-10-01"

  # -- WikiFX profile licence box
  - id: gb-licence
    url: "https://www.wikifx.com/th/dealer/8341918460.html"
    action: capture
    kind: still
    covers: [MAIN-2, MAIN-3, MAIN-4]
    wait_ms: 2500
    crop:
      selector: ".dealer-regulatory"
      pad: 1.0
    hide_selectors:
      - ".advertisement-list"
      - ".wiki-direct"
      - ".article-r"
      - ".head-r"
      - ".dealer-primary-jaf-new"
      - ".article-c img, .article-info img"
      - ".chrome_ctx_right"
      - ".new_chrome_down"
      - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
      - ".top-comment-item"
      - ".dealer-survey-container"
    hide_texts:
      - "切换"
    censor_profiles: [personal_data, broker_contact]
    source_note: "WikiFX: no forex licence found, as shown on the profile"

  # -- WikiFX profile basic-info box
  - id: gb-basic
    url: "https://www.wikifx.com/th/dealer/8341918460.html"
    action: capture
    kind: still
    covers: [MAIN-5, MAIN-6]
