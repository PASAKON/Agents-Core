# BLACK LIQUIDITY EP59 -- GVD Markets (WikiFX) -- real-footage shot list
# Run with: python tools/bl_realfootage.py run --shots prototypes/bl59-realfootage/shots.yaml --episode bl59
#
# Sources (all public pages, no login, captured 2026-10-01 Thai time, see prototypes/bl59-script/RUNLOG.md):
#   profile = https://www.wikifx.com/th/dealer/3938681280.html  (WikiFX profile: GVD Markets, Cyprus)
#   art1    = https://www.wikifx.com/th/newsdetail/202609296884498721.html (29 Sep 2026 review, field-visit finding)
#   art2    = https://www.wikifx.com/th/newsdetail/202604228024859656.html (22 Apr 2026, licence table + caveat)
#   srv     = https://www.wikifx.com/th/survey/4354228159.html (WikiFX field visit, 2024-10-22, Cyprus, Danger)
#   expo    = https://www.wikifx.com/th/survey/712574a54c.html (WikiFX Expo Dubai 2024 page, GVD Gold Sponsor)
#   exp1    = https://www.wikifx.com/th/exposure/detail/COG20251026013307127649203.html (complaint, withdrawal + 2,800 USDT "tax")
#   exp2    = https://www.wikifx.com/th/exposure/detail/COG20251008061622342987695.html (complaint, withdrawal not processed)
#
# censor_profiles and the x-wikifx-hygiene hide-block are REUSED VERBATIM from
# prototypes/bl58-realfootage/shots.yaml (which reused bl57). Additions for EP59 only:
#   broker_contact = GVD's own website / email / phone (so no link is on screen even as text)
#   survey_address = the field-visit building address (same conservative rule as EP58)
# Per-shot hide lists = the verbatim hygiene list + that shot's extras.
#
# NOT captured by this file: the checklist cards in SUMMARY (graphics), no real page behind them.

censor_profiles:
  personal_data:
    - {label: "reviewer avatar + username", kind: full, avatar_heuristic: true}
  faces: []
  promo:
    - {label: "signup/register CTA (สมัคร)", kind: full, text: "สมัคร"}
    - {label: "register CTA (ลงทะเบียน)", kind: full, text: "ลงทะเบียน"}
    - {label: "download app CTA", kind: full, text: "ดาวน์โหลด"}
    - {label: "bonus/prize banner (รางวัล)", kind: full, text: "รางวัล"}
    - {label: "gift/welcome-bonus banner (ของขวัญ)", kind: full, text: "ของขวัญ"}
    - {label: "dollar bonus amount", kind: full, regex: "\\$[\\d,]{4,}"}
    - {label: "unrelated product upsell (BotBuilt)", kind: full, text: "BotBuilt"}
  broker_logo_partial:
    - label: "header logo (partial)"
      kind: partial
      selector: ".nav-logo-link, header img[alt*=logo], a[href='/'] img"
      fraction: 0.4
      side: right
      min_w: 60
  complaint_ids:
    - {label: "complainant FX id", kind: full, regex: "FX\\d{8,}"}
    - {label: "complaint COG id", kind: full, regex: "COG\\d{10,}"}
  broker_contact:
    - {label: "broker website / email / phone text (regex, exact text range)", kind: full, regex: "(https?://)?(www\\.)?gvd(markets|trading|marketsth)\\.(com|eu)\\S*|cs@gvdmarkets\\.com|\\+?357\\s?25\\s?261457"}
  survey_address:
    - {label: "private street address, Thai", kind: full, regex: "[0-9]+\\s*ถนน\\S*"}
    - {label: "field-visit building address (Omirou)", kind: full, regex: "20\\s*Omirou,?\\s*Thomaides\\s*Group"}
    - {label: "field-visit street name", kind: full, regex: "Omirou\\S*"}

x-wikifx-hygiene: &wikifx_hygiene
  hide_selectors:
    - ".advertisement-list"
    - ".wiki-direct"
    - ".article-r"
    - ".head-r"
    - ".dealer-primary-jaf-new"
    - ".article-c img, .article-info img"
    - ".chrome_ctx_right"
    - ".new_chrome_down"
    - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
  hide_texts:
    - "切换"

shots:
  # -- WikiFX profile header: logo + name + score + grade
  - id: gvd-header
    url: "https://www.wikifx.com/th/dealer/3938681280.html"
    action: capture
    kind: still
    covers: [HOOK-1, CONTEXT-1, MAIN-1]
    wait_ms: 2500
    crop:
      selector: ".head-l-john"
      pad: 2.4
    hide_selectors:
      - ".advertisement-list"
      - ".wiki-direct"
      - ".article-r"
      - ".head-r"
      - ".dealer-primary-jaf-new"
      - ".article-c img, .article-info img"
      - ".chrome_ctx_right"
      - ".new_chrome_down"
      - "iframe[id*=google_ads], iframe[id*='/ad_'], [id*=dfp-ad], [class*=adsbygoogle]"
      - ".dealer-survey-container"
    hide_texts:
      - "切换"
    censor_profiles: [personal_data, broker_contact]
    source_note: "score badge is an odometer reel, anchored on the header container not on digits"

  # -- WikiFX profile licence box
