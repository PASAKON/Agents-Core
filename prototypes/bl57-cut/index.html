      /* ============================ BL KIT ============================
         BLACK LIQUIDITY video kit. Catalogue and rationale: BL-KIT.md
         Theme (CEO 2026-09-18): black / red / white, red always emissive neon.
         Motion grammar is measured off the reference edit, not chosen:
         every reveal is expo.out, text arrives by clip-path wipe (never a
         fade), rules scale from a left or top origin.
         ================================================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --ink:    #07080A;
        --red:    #E0202F;
        --neon:   #FF2D40;
        --white:  #F4F6F7;
        --yellow: #F4DF14;
        --muted:  #98A0A8;
        --line:   rgba(255,255,255,.12);
        --glow-s: 0 0 10px rgba(255,45,64,.55);
        --glow-m: 0 0 22px rgba(255,45,64,.55), 0 0 44px rgba(255,45,64,.22);
        --outline: 0 0 10px rgba(0,0,0,.95), 0 4px 18px rgba(0,0,0,.9),
                   2px 2px 0 rgba(0,0,0,.92), -2px 2px 0 rgba(0,0,0,.92),
                   2px -2px 0 rgba(0,0,0,.92), -2px -2px 0 rgba(0,0,0,.92);

        /* TikTok safe area, in this canvas's own pixels. TikTok's published
           spec is a 540x960 reference with margins 126 top / 60 left /
           120 right / 378 bottom; doubled, that is what sits below. Measured
           against a real post on the CEO's phone (1188x2576, 2026-09-18):
           a 9:16 video is scaled to COVER a 19.5:9 screen, so 97px of each
           side is cropped off the frame entirely and never seen, the app's
           own top nav sits over y 138-186, the right rail over x 873-983
           below y ~960, and the scrub bar over y ~1789. Nothing the audience
           must read may leave this box. */
        --safe-top:    252px;
        --safe-left:   120px;
        --safe-right:  240px;   /* right rail: content must end by x=840 */
        --safe-bottom: 756px;   /* caption + scrub bar: end by y=1164 */
      }

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%;
              background: var(--ink); color: var(--white); font-family: Kanit, sans-serif; }

      .clip { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
      video.clip { object-fit: cover; }

      /* Avatar composite — matted avatar over a real-footage/B-roll plate.
         Measured off the CEO's paid (฿1300) editor cut (task-4bce29e5,
         2026-09-23; contact sheet + numbers in the skill's field notes),
         n=10 composite frames: height 55.8% ±3.1 of the 1920 frame (min
         52.9 max 64.0), top edge at 44.2% ±3.1 down the frame (y≈850px),
         x-center ≈37% (left of centre), ALWAYS cut off by the frame
         bottom — chest-up only, never full body. Full-frame avatar shots
         measured separately at 88.7% height / 11.3% top / 52.4% x-center
         (n=2) for comparison — that is the OTHER mode, not this one; do
         not blend the two.
         Use a <video class="avatar-comp" src="media/matte/lip_a-matte.webm">
         made by `bl_tools.py matte`, layered above the plate (z-index 2)
         and below kinetic text (.stage is z-index 30) so a block can still
         wipe in over the avatar's head, same as the reference. */
      .avatar-comp { position: absolute; left: 0; bottom: 0; z-index: 2;
                     height: 56%; width: auto; object-fit: contain;
                     object-position: left bottom; transform: translateX(-6%); }
      /* Darken+blur a B-roll/chart plate behind a composited avatar —
         measured mean luminance ~20-40/255 on those plates (naturally dark
         source, not necessarily graded darker; verify before assuming).
         Do NOT apply this to a real-footage screenshot plate (rule 5a) —
         measured those at ~230+/255, essentially undarkened, because the
         text on them has to stay legible. Apply by hand, never blindly. */
      .plate-darkened { filter: brightness(.4) saturate(.85) blur(1.5px); }

      .bl-bg { position: absolute; inset: 0; z-index: 0; opacity: 1;   /* under the clips: footage covers it, text plates show it */
               background: radial-gradient(130% 62% at 50% 6%, rgba(224,32,47,.20), transparent 62%),
                           var(--ink); }
      .bl-bg .grid { position: absolute; inset: 0; opacity: .5;
        background-image: linear-gradient(rgba(255,45,64,.07) 2px, transparent 2px),
                          linear-gradient(90deg, rgba(255,45,64,.07) 2px, transparent 2px);
        background-size: 108px 108px; }
      .bl-bg .scan { position: absolute; inset: 0; opacity: .35;
        background: repeating-linear-gradient(rgba(255,255,255,.035) 0 2px, transparent 2px 6px); }

      .stage { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
      /* Every overlay block lives inside the TikTok safe box. left was 62 and
         right was 62 until 2026-09-18: 62 is inside the 97px the phone crops,
         so the first characters of a left-aligned line were physically cut
         off the screen, and the right edge ran under the like/comment rail. */
      .blk { position: absolute; left: var(--safe-left); right: var(--safe-right);
             opacity: 0; text-align: center; }
      /* Thai writes without spaces between words, and the render's Chrome has no
         ICU Thai dictionary, so it breaks a line wherever it runs out of room —
         on EP54 that split สเปรด as "...ของส" / "เปรด...". `lang="th"` is set and
         does NOT prevent this: the breaking happens in the render's Chrome.
         `word-break: keep-all` does not prevent it either — CSS Text 3 scopes
         keep-all to the CJK line-break classes (NU/AL/AI/ID); Thai is class SA
         and is untouched. Measured, not assumed: the identical break rendered
         with and without keep-all, and a ZWSP only ADDS a break opportunity
         without removing the others.
         What works is white-space: nowrap on the run itself. Wrap any Thai word
         that must never split in <span class="nb">…</span>. No gate can see a
         mid-word break — read the Thai in the rendered frame, as words. */
      .nb { white-space: nowrap; }
      /* Only for a block that ENDS above y=900 — above the rail the right
         margin can come back in to 120. Never on anything lower. */
      .blk.wide { right: var(--safe-left); }
      .blk.l { text-align: left; }

      .bl-xl { font-weight: 800; font-size: 104px; line-height: 1.26; text-shadow: var(--outline); }
      .bl-lg { font-weight: 800; font-size:  82px; line-height: 1.28; text-shadow: var(--outline); }
      .bl-md { font-weight: 800; font-size:  62px; line-height: 1.32; text-shadow: var(--outline); }
      .bl-sm { font-weight: 600; font-size:  44px; line-height: 1.38; text-shadow: var(--outline); }
      .bl-xs { font-weight: 600; font-size:  34px; line-height: 1.30; color: var(--muted); }
      .y { color: var(--yellow); }
      .n { color: var(--neon); text-shadow: var(--outline), var(--glow-s); }
      .wipe { display: inline-block; clip-path: inset(0 100% 0 0); }

      .bl-rule  { display: block; height: 8px; border-radius: 4px; background: var(--neon);
                  box-shadow: var(--glow-m); transform: scaleX(0); transform-origin: left center; }
      .bl-vline { position: absolute; width: 7px; border-radius: 4px;
                  background: linear-gradient(var(--red), var(--neon));
                  box-shadow: var(--glow-s); transform: scaleY(0); transform-origin: top center; }

      .bl-card { position: relative; background: rgba(10,11,13,.78);
                 border: 2px solid var(--line); border-left: 10px solid var(--neon);
                 border-radius: 20px; padding: 26px 32px; text-align: left;
                 box-shadow: 0 22px 50px rgba(0,0,0,.55), -14px 0 26px -12px rgba(255,45,64,.55); }
      .bl-card .nm { font-family: Archivo, sans-serif; font-weight: 800; font-size: 52px;
                     letter-spacing: -.01em; line-height: 1.20; }
      .bl-card .cl { font-weight: 600; font-size: 38px; color: #D7DCE0; margin-top: 6px; }
      .bl-card .badge { position: absolute; right: 24px; top: 22px; background: var(--red);
                        color: #fff; font-weight: 800; font-size: 24px; padding: 7px 15px;
                        border-radius: 10px; letter-spacing: .04em; box-shadow: var(--glow-s); }

      .bl-rulecard .idx { width: 118px; height: 118px; border-radius: 50%;
                          border: 4px solid var(--neon); box-shadow: var(--glow-m);
                          display: flex; align-items: center; justify-content: center;
                          font-family: Archivo, sans-serif; font-weight: 800; font-size: 62px;
                          color: var(--neon); }
      .bl-rulecard .hd  { font-weight: 800; font-size: 72px; line-height: 1.30;
                          margin-top: 28px; text-shadow: var(--outline); }
      .bl-rulecard .dt  { font-weight: 600; font-size: 44px; line-height: 1.34;
                          color: #CBD2D8; margin-top: 18px; }

      .bl-row { display: flex; align-items: flex-start; gap: 22px; text-align: left;
                background: rgba(10,11,13,.78); border: 2px solid var(--line);
                border-radius: 18px; padding: 22px 26px; }
      .bl-row .tick { flex: none; width: 46px; height: 46px; border-radius: 50%;
                      background: var(--neon); box-shadow: var(--glow-s); color: #12060A;
                      font-family: Archivo, sans-serif; font-weight: 800; font-size: 26px;
                      display: flex; align-items: center; justify-content: center; margin-top: 4px; }
      .bl-row .tx { font-weight: 600; font-size: 42px; line-height: 1.26; }

      .bl-stat .big { font-family: Archivo, sans-serif; font-weight: 800; font-size: 156px;
                      line-height: .96; color: var(--neon); text-shadow: var(--outline), var(--glow-m); }
      .bl-stat .lb  { font-weight: 600; font-size: 42px; color: #D7DCE0; margin-top: 12px;
                      text-shadow: var(--outline); }   /* was missing; failed contrast over bright plates (BL50) */


      /* Standing legal label — on every frame of every episode, never animated.
         The CEO ruled on 2026-09-17 that a ป้ายเตือน goes on every Forex surface,
         and the statute this answers to is the one aimed at the marketing layer:
         BOT's 25 Jun 2026 statement puts anyone who "โฆษณา ประกาศ หรือชักชวน
         ประชาชน" to trade FOREX under พ.ร.ก. การกู้ยืมเงินที่เป็นการฉ้อโกงประชาชน
         2527, with no carve-out for promising no returns. A label does not cure
         conduct — it states intent, and the script has to match it. */
      /* y was 1790 until 2026-09-18. Measured on a real post on the CEO's own
         phone that same day: TikTok's scrub bar sits at video y~1789 and its
         caption block starts at y~1550, so a label at 1790 is drawn under the
         player's own chrome and cannot be read. 1430 is the lowest line that
         is still clear of both and still inside the frame the CEO drew. */
      .bl-legal { position: absolute; left: var(--safe-left); right: var(--safe-right);
                  top: 1430px; z-index: 45;
                  font-family: Kanit, sans-serif; font-weight: 400; font-size: 24px;
                  line-height: 1.35; text-align: center; color: #B9C0C6;
                  text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,1);
                  /* A text-shadow (even the kit's own --outline 4-way stroke) does
                     NOT satisfy hyperframes check's WCAG contrast pass against a
                     bright plate — verified 2026-09-23 (task-4bce29e5): swapping to
                     --outline alone still failed at 1.6:1. Only an actual opaque
                     backing works, same trick .bl-card/.bl-row already use. Only
                     needed once a real-footage plate (rule 5a) can fill the WHOLE
                     frame bright behind this label; harmless on the kit's normal
                     dark backgrounds. */
                  background: rgba(7,8,10,.72); padding: 8px 24px;
                  border-radius: 10px; width: fit-content; margin: 0 auto; }
      /* Brand bug — the channel's real logo, same place on every clip.
         `left/top` and the logo height are fixed: the audience recognises the
         mark by where it sits, and a bug that drifts between episodes reads as
         a different channel. The date is the day the episode was MADE, not the
         day it is posted — posting lands 0-2 days later and the made-on date is
         what everything else references. */
      .bug { position: absolute; right: 150px; top: 310px; z-index: 40;
             display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      .bug .logo { height: 60px; width: auto; display: block;
                   filter: drop-shadow(0 3px 10px rgba(0,0,0,.85)); }
      .bug .b1 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 62px;
                 letter-spacing: .06em; color: #fff; text-shadow: var(--outline); line-height: .92; }
      .bug .b2 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 54px;
                 letter-spacing: .10em; color: var(--neon); line-height: .92;
                 text-shadow: var(--outline), var(--glow-s); }
      .bug .rl { width: 74px; height: 5px; background: var(--neon); border-radius: 3px;
                 box-shadow: var(--glow-s); }
      .bug .dt2 { font-weight: 600; font-size: 24px; color: #E8EAEC; letter-spacing: .02em;
                  text-shadow: var(--outline);
                  /* same contrast gap and same fix as .bl-legal above - the
                     stroke alone does not pass over a bright real-footage plate. */
                  background: rgba(7,8,10,.72); padding: 3px 10px; border-radius: 6px; }

      /* y was 1600: that is inside TikTok's own caption + username block
         (measured y 1550-1700 on a real post, 2026-09-18), so the subtitle was
         being read through the app's text. 1300 keeps it low in frame and clear. */
      .caplayer { position: absolute; left: 0; right: 0; top: 1300px; height: 0; z-index: 35; }
      .cap { position: absolute; left: var(--safe-left); right: var(--safe-right);
             top: 0; transform: translateY(-50%);
             text-align: center; opacity: 0; font-weight: 600; font-size: 48px;
             line-height: 1.28; text-shadow: var(--outline); }
    </style>
