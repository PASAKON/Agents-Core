      /* ============================ BL KIT ============================
         BLACK LIQUIDITY video kit. Catalogue and rationale: BL-KIT.md
         Theme (CEO 2026-09-18): black / red / white, red always emissive neon.
         Motion grammar is measured off the reference edit, not chosen:
         every reveal is expo.out, text arrives by clip-path wipe (never a
         fade), rules scale from a left or top origin.
         ================================================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --ink:    #07080A;
        --red:    #E0202F;
        --neon:   #FF2D40;
        --white:  #F4F6F7;
        --yellow: #F4DF14;
        --muted:  #98A0A8;
        --line:   rgba(255,255,255,.12);
        --glow-s: 0 0 10px rgba(255,45,64,.55);
        --glow-m: 0 0 22px rgba(255,45,64,.55), 0 0 44px rgba(255,45,64,.22);
        --outline: 0 0 10px rgba(0,0,0,.95), 0 4px 18px rgba(0,0,0,.9),
                   2px 2px 0 rgba(0,0,0,.92), -2px 2px 0 rgba(0,0,0,.92),
                   2px -2px 0 rgba(0,0,0,.92), -2px -2px 0 rgba(0,0,0,.92);

        --safe-top:    252px;
        --safe-left:   120px;
        --safe-right:  240px;   /* right rail: content must end by x=840 */
        --safe-bottom: 756px;   /* caption + scrub bar: end by y=1164 */
      }

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%;
              background: var(--ink); color: var(--white); font-family: Kanit, sans-serif; }

      .clip { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
      video.clip { object-fit: cover; }

      .avatar-comp { position: absolute; left: 0; bottom: 0; z-index: 2;
                     height: 56%; width: auto; object-fit: contain;
                     object-position: left bottom; transform: translateX(-6%); }
      .plate-darkened { filter: brightness(.4) saturate(.85) blur(1.5px); }

      .bl-bg { position: absolute; inset: 0; z-index: 0; opacity: 1;
               background: radial-gradient(130% 62% at 50% 6%, rgba(224,32,47,.20), transparent 62%),
                           var(--ink); }
      .bl-bg .grid { position: absolute; inset: 0; opacity: .5;
        background-image: linear-gradient(rgba(255,45,64,.07) 2px, transparent 2px),
                          linear-gradient(90deg, rgba(255,45,64,.07) 2px, transparent 2px);
        background-size: 108px 108px; }
      .bl-bg .scan { position: absolute; inset: 0; opacity: .35;
        background: repeating-linear-gradient(rgba(255,255,255,.035) 0 2px, transparent 2px 6px); }

      .stage { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
      /* Evidence focus frame & yellow highlighter bars (descendant rules under .stage, SKILL.md §6d) */
      .stage .evbox { position: absolute; left: 120px; top: 528px; width: 840px; height: 300px;
                      border: 3px solid var(--neon); border-radius: 16px;
                      box-shadow: var(--glow-m), 0 22px 54px rgba(0,0,0,.78); opacity: 0; }
      .stage .hl-bar { position: absolute; height: 34px; background: var(--yellow);
                       border-radius: 6px; mix-blend-mode: multiply; opacity: 0.92;
                       transform: scaleX(0); transform-origin: left center; }

      .blk { position: absolute; left: var(--safe-left); right: var(--safe-right);
             opacity: 0; text-align: center; }
      .nb { white-space: nowrap; }
      .blk.wide { right: var(--safe-left); }
      .blk.l { text-align: left; }

      .bl-xl { font-weight: 800; font-size: 104px; line-height: 1.26; text-shadow: var(--outline); }
      .bl-lg { font-weight: 800; font-size:  82px; line-height: 1.28; text-shadow: var(--outline); }
      .bl-md { font-weight: 800; font-size:  62px; line-height: 1.32; text-shadow: var(--outline); }
      .bl-sm { font-weight: 600; font-size:  44px; line-height: 1.38; text-shadow: var(--outline); }
      .bl-xs { font-weight: 600; font-size:  34px; line-height: 1.30; color: var(--muted); }
      .y { color: var(--yellow); }
      .n { color: var(--neon); text-shadow: var(--outline), var(--glow-s); }
      .wipe { display: inline-block; clip-path: inset(0 100% 0 0);
              background: rgba(7,8,10,.76); padding: 4px 18px; border-radius: 12px; }

      .bl-rule  { display: block; height: 8px; border-radius: 4px; background: var(--neon);
                  box-shadow: var(--glow-m); transform: scaleX(0); transform-origin: left center; }
      .bl-vline { position: absolute; width: 7px; border-radius: 4px;
                  background: linear-gradient(var(--red), var(--neon));
                  box-shadow: var(--glow-s); transform: scaleY(0); transform-origin: top center; }

      .bl-card { position: relative; background: rgba(10,11,13,.84);
                 border: 2px solid var(--line); border-left: 10px solid var(--neon);
                 border-radius: 20px; padding: 26px 32px; text-align: left;
                 box-shadow: 0 22px 50px rgba(0,0,0,.55), -14px 0 26px -12px rgba(255,45,64,.55); }
      .bl-card .nm { font-family: Archivo, sans-serif; font-weight: 800; font-size: 52px;
                     letter-spacing: -.01em; line-height: 1.20; }
      .bl-card .cl { font-weight: 600; font-size: 38px; color: #D7DCE0; margin-top: 6px; }
      .bl-card .badge { position: absolute; right: 24px; top: 22px; background: var(--red);
                        color: #fff; font-weight: 800; font-size: 24px; padding: 7px 15px;
                        border-radius: 10px; letter-spacing: .04em; box-shadow: var(--glow-s); }

      .bl-rulecard .idx { width: 118px; height: 118px; border-radius: 50%;
                          border: 4px solid var(--neon); box-shadow: var(--glow-m);
                          display: flex; align-items: center; justify-content: center;
                          font-family: Archivo, sans-serif; font-weight: 800; font-size: 62px;
                          color: var(--neon); }
      .bl-rulecard .hd  { font-weight: 800; font-size: 72px; line-height: 1.30;
                          margin-top: 28px; text-shadow: var(--outline); }
      .bl-rulecard .dt  { font-weight: 600; font-size: 44px; line-height: 1.34;
                          color: #CBD2D8; margin-top: 18px; }

      .bl-row { display: flex; align-items: flex-start; gap: 22px; text-align: left;
                background: rgba(10,11,13,.84); border: 2px solid var(--line);
                border-radius: 18px; padding: 22px 26px; }
      .bl-row .tick { flex: none; width: 46px; height: 46px; border-radius: 50%;
                      background: var(--neon); box-shadow: var(--glow-s); color: #12060A;
                      font-family: Archivo, sans-serif; font-weight: 800; font-size: 26px;
                      display: flex; align-items: center; justify-content: center; margin-top: 4px; }
      .bl-row .tx { font-weight: 600; font-size: 42px; line-height: 1.26; }

      .bl-stat { background: rgba(10,11,13,.84); border: 2px solid var(--line);
                 border-top: 6px solid var(--neon); border-radius: 20px;
                 padding: 20px 30px; box-shadow: 0 18px 42px rgba(0,0,0,.6); }
      .bl-stat .big { font-family: Archivo, Kanit, sans-serif; font-weight: 800; font-size: 110px;
                      line-height: 1.02; color: var(--neon); text-shadow: var(--outline), var(--glow-m); }
      .bl-stat .lb  { font-weight: 600; font-size: 36px; color: #D7DCE0; margin-top: 10px;
                      text-shadow: var(--outline); }

      .bl-legal { position: absolute; left: var(--safe-left); right: var(--safe-right);
                  top: 1430px; z-index: 45;
                  font-family: Kanit, sans-serif; font-weight: 400; font-size: 24px;
                  line-height: 1.35; text-align: center; color: #B9C0C6;
                  text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,1);
                  background: rgba(7,8,10,.72); padding: 8px 24px;
                  border-radius: 10px; width: fit-content; margin: 0 auto; }

      .bug { position: absolute; right: 150px; top: 310px; z-index: 40;
             display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      .bug .logo { height: 60px; width: auto; display: block;
                   filter: drop-shadow(0 3px 10px rgba(0,0,0,.85)); }
      .bug .b1 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 62px;
                 letter-spacing: .06em; color: #fff; text-shadow: var(--outline); line-height: .92; }
      .bug .b2 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 54px;
                 letter-spacing: .10em; color: var(--neon); line-height: .92;
                 text-shadow: var(--outline), var(--glow-s); }
      .bug .rl { width: 74px; height: 5px; background: var(--neon); border-radius: 3px;
                 box-shadow: var(--glow-s); }
      .bug .dt2 { font-weight: 600; font-size: 24px; color: #E8EAEC; letter-spacing: .02em;
                  text-shadow: var(--outline);
                  background: rgba(7,8,10,.72); padding: 3px 10px; border-radius: 6px; }

      .caplayer { position: absolute; left: 0; right: 0; top: 1300px; height: 0; z-index: 35; }
      .cap { position: absolute; left: var(--safe-left); right: var(--safe-right);
             top: 0; transform: translateY(-50%);
             text-align: center; opacity: 0; font-weight: 600; font-size: 48px;
             line-height: 1.28; text-shadow: var(--outline);
             text-wrap: balance;
             background: rgba(5,6,8,.90); padding: 20px 30px;
             border-radius: 18px; box-shadow: 0 10px 28px rgba(0,0,0,.55); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      var stage = document.getElementById("stage");
      var tl = gsap.timeline({ paused: true });
      var E = "expo.out";

      function el(h) { var d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; }
      function show(s, at) { tl.to(s, { opacity: 1, duration: 0.12, ease: "power1.out" }, at); }
      function hide(s, at) { tl.to(s, { opacity: 0, duration: 0.18, ease: "power1.in" }, at); }
      function wipe(s, at, d) {
        tl.fromTo(s, { clipPath: "inset(0 100% 0 0)" },
                     { clipPath: "inset(0 0% 0 0)", duration: d || 0.60, ease: E }, at); }
      function sweep(s, at, d) { tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d || 0.8, ease: E }, at); }
      function grow(s, at, d)  { tl.fromTo(s, { scaleY: 0 }, { scaleY: 1, duration: d || 0.9, ease: E }, at); }
      function slide(s, at, d) { tl.fromTo(s, { opacity: 0, x: -64 }, { opacity: 1, x: 0, duration: d || 0.7, ease: E }, at); }
      function drop(s, at, d)  { tl.fromTo(s, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: d || 0.6, ease: "power3.out" }, at); }

      var B = 0;
      function block(cls, top, at, out) {
        var wide = (top < 900) ? " wide" : "";
        var id = "b" + (++B);
        var d = el('<div class="blk ' + (cls || "") + wide + '" id="' + id + '" style="top:' + top + 'px"></div>');
        stage.appendChild(d); show("#" + id, at); if (out) hide("#" + id, out);
        return { id: id, node: d };
      }

      var KINETIC_FONT_FLOOR = 32;
      function fitKineticLine(span, safeW) {
        span.style.whiteSpace = "nowrap";
        var size = parseFloat(window.getComputedStyle(span).fontSize);
        for (var i = 0; i < 8; i++) {
          var w = span.getBoundingClientRect().width;
          if (w <= safeW) return;
          if (size <= KINETIC_FONT_FLOOR) break;
          size = Math.max(KINETIC_FONT_FLOOR, Math.floor(size * (safeW / w) * 0.97));
          span.style.fontSize = size + "px";
        }
        var finalW = span.getBoundingClientRect().width;
        if (finalW > safeW) {
          throw new Error('kinetic(): line "' + span.textContent + '" is ' + Math.round(finalW) +
            'px wide, still over the ' + Math.round(safeW) + 'px safe box at the ' +
            KINETIC_FONT_FLOOR + 'px floor -- split it into more kinetic lines.');
        }
      }

      function kinetic(top, at, out, lines, ruleW) {
        var b = block("", top, at, out), t = at + 0.05;
        var safeW = b.node.getBoundingClientRect().width;
        lines.forEach(function (ln, i) {
          var w = b.id + "w" + i;
          b.node.appendChild(el('<div class="' + ln.c + '" style="margin-top:' + (i ? 18 : 0) + 'px">' +
            '<span class="wipe" id="' + w + '">' + ln.h + '</span></div>'));
          fitKineticLine(document.getElementById(w), safeW);
          wipe("#" + w, t, ln.d || 0.60); t += (ln.g || 0.62); });
        if (ruleW) {
          var r = b.id + "r";
          b.node.appendChild(el('<div style="position:relative;height:8px;margin:24px auto 0;width:' +
            ruleW + 'px"><span class="bl-rule" id="' + r + '"></span></div>'));
          sweep("#" + r, t, 0.85); }
        return b;
      }

      function cards(top, at, out, title, items, visible) {
        var b = block("", top, at, out), tid = b.id + "t";
        b.node.appendChild(el('<div class="bl-md"><span class="wipe" id="' + tid + '">' + title + '</span></div>'));
        wipe("#" + tid, at + 0.05, 0.55);
        var wrap = el('<div style="margin-top:30px;overflow:hidden"></div>');
        var inner = el('<div id="' + b.id + 'i" style="display:flex;flex-direction:column;gap:18px"></div>');
        wrap.appendChild(inner); b.node.appendChild(wrap);
        items.forEach(function (it, i) {
          var c = b.id + "c" + i;
          inner.appendChild(el('<div class="bl-card" id="' + c + '"><div class="badge">อ้าง</div>' +
            '<div class="nm">' + it.n + '</div><div class="cl">' + it.c + '</div></div>'));
          tl.set("#" + c, { opacity: 0 }, 0);
          slide("#" + c, it.t, 0.62);
          if (i > 0) tl.to("#" + b.id + "c" + (i - 1), { opacity: 0.4, duration: 0.4, ease: "power2.inOut" }, it.t);
        });
        var pitch = inner.children.length > 1
          ? inner.children[1].offsetTop - inner.children[0].offsetTop
          : inner.children[0].offsetHeight + 18;
        wrap.style.height = (pitch * visible) + "px";
        items.forEach(function (it, i) {
          if (i >= visible) tl.to("#" + b.id + "i",
            { y: -(i - visible + 1) * pitch, duration: 0.6, ease: E }, it.t); });
        return b;
      }

      function check(top, at, out, title, items) {
        var b = block("", top, at, out), tid = b.id + "t";

        wipe("#" + tid, at + 0.05, 0.55);

        b.node.appendChild(box);

      function rules(top, items) {
        items.forEach(function (it) {

            { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, it.t);
          wipe("#" + h2, it.t + 0.22, 0.62);
          wipe("#" + d2, it.t + 0.72, 0.60);
          sweep("#" + r2, it.t + 1.10, 0.8); });

        return b;

      /* -------- KINETIC & GRAPHIC BLOCKS (0.00s - 10.00s, zero overlap) -------- */

      // BLOCK 1 (0.00 - 0.82s): Scroll-stopping Frame-0 Hook Banner above presenter's head (y=445..660)
      var bHook = kinetic(445, 0.00, 0.82, [
        { c: "bl-sm", h: '<span class="nb">ตามที่เจ้าของโพสต์เล่า · กำไรเกือบ</span> <span class="y" id="hk-num">6,000,000</span> <span class="nb">฿</span>', d: 0.25, g: 0.08 },
        { c: "bl-lg", h: '<span class="nb">แต่โบรกเกอร์</span> <span class="n">CXM</span> <span class="nb">ไม่จ่าย?!</span>', d: 0.35, g: 0.12 }
      ], 480);
      // Pin Frame 0 (t=0) so the cover frame is immediately legible and never snaps off
      bHook.node.style.opacity = "1";
      tl.fromTo("#" + bHook.id + "w0",
        { clipPath: "inset(0 0% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.30, ease: E }, 0);
      var hkCounter = { v: 5400000 };
      var hkNumEl = document.getElementById("hk-num");
      tl.to(hkCounter, {
        v: 6000000,
        duration: 0.70,
        ease: E,
        onUpdate: function () {
          hkNumEl.textContent = Math.round(hkCounter.v).toLocaleString("en-US");
        }
      }, 0);

      // BLOCK 2 (1.00 - 2.02s): Compact 2-Hour Hold Headline above presenter's head (y=445..640)
      kinetic(445, 1.00, 2.02, [
        { c: "bl-sm", h: '<span class="nb">ตามที่เจ้าของโพสต์เล่า · เทรดทองมือถือ</span>', d: 0.32, g: 0.16 },
        { c: "bl-lg", h: '<span class="nb">ถือออเดอร์นาน</span> <span class="y" id="hr-num">2.0</span> <span class="nb">ชั่วโมง</span>', d: 0.38, g: 0.20 }
      ], 440);
      var hrCounter = { v: 0 };
      var hrNumEl = document.getElementById("hr-num");
      tl.to(hrCounter, {
        v: 2,
        duration: 0.55,
        ease: E,
        onUpdate: function () {
          hrNumEl.textContent = hrCounter.v >= 1.95 ? "2" : hrCounter.v.toFixed(1);

      // BLOCK 3 (2.20 - 3.42s): Paradox Stats Comparison over darkened B-roll (y=450..820)

        { b: '2 <span class="y">ชม.</span>', l: '<span class="nb">ถือออเดอร์จริง (ตามโพสต์)</span>', t: 2.24 },
        { b: '<span class="n">FAST?!</span>', l: '<span class="nb">ข้อหาจากโบรกเกอร์ CXM</span>', t: 2.75 }
      ]);

      // BLOCK 4A (3.60 - 6.22s): Attribution Header above Real FB Post Evidence Stills (y=445..506, above y=528 still)
      kinetic(445, 3.60, 6.22, [
        { c: "bl-sm", h: '<span class="nb">ตามที่เจ้าของโพสต์เล่า · โพสต์ผู้เสียหาย</span>', d: 0.40, g: 0.20 }
      ], 0);

      // BLOCK 4B (3.60 - 6.22s): Live 6,000,000 Baht Profit Callout below Evidence Still (top=905 >= 900 -> narrow box x=120..840, y=905..1120)
      kinetic(905, 3.60, 6.22, [
        { c: "bl-sm", h: '<span class="n">CXM</span> <span class="nb">ปฏิเสธจ่ายกำไรบัญชี Cent</span>', d: 0.42, g: 0.20 },
        { c: "bl-lg", h: '<span class="nb">เกือบ</span> <span class="y" id="m6-num">6,000,000</span> <span class="nb">บาท!</span>', d: 0.46, g: 0.24 }
      ], 420);
      var m6Counter = { v: 1200000 };
      var m6NumEl = document.getElementById("m6-num");
      tl.to(m6Counter, {
        v: 6000000,
        duration: 1.15,
        ease: E,
        onUpdate: function () {
          m6NumEl.textContent = Math.round(m6Counter.v).toLocaleString("en-US");

      kinetic(445, 6.40, 7.62, [

        { c: "bl-lg", h: '<span class="y">CXM</span> <span class="nb">แจ้งข้อหาทางอีเมล</span>', d: 0.44, g: 0.24 }
      ], 440);

      // BLOCK 6 (7.80 - 10.00s): Scrolling Toxic Trading Claim Cards (y=450..754, visible=1, holds through 10.00s)
      cards(450, 7.80, 0, '<span class="n">"TOXIC TRADING"</span> <span class="nb">คือข้อหาที่อ้าง</span>', [
        {
          n: 'TOXIC TRADING',
          c: '<span class="nb">CXM แจ้งในอีเมลว่าเทรดเร็วเกินไป · ปฏิเสธจ่าย</span>',
          t: 7.86

        {

          c: '<span class="nb">ตามที่เจ้าของโพสต์เล่า: ถือ 2 ชม. แต่ชวดเกือบ 6 ล้าน</span>',
          t: 8.60
        }
      ], 1);

      /* -------- SPOKEN-LINE CAPTIONS (SKILL.md §6f: one caption style, every mode) -------- */
      caption(1.00, 3.60, '<span class="nb">ถือออเดอร์</span> <span class="y">2 ชั่วโมง</span><br><span class="nb">แต่โดนข้อหาเทรดเร็วเกินไป?</span>');
      caption(3.60, 6.40, '<span class="nb">เธอเล่าว่า</span> <span class="y">CXM</span> <span class="nb">ไม่จ่ายกำไร</span><br><span class="nb">เกือบ</span> <span class="n">6 ล้านบาท</span>');
      caption(6.40, 9.30, '<span class="y">CXM</span> <span class="nb">แจ้งในอีเมลว่าเป็น</span><br><span class="n">"Toxic Trading"</span>');
      // Closing summary caption (9.30 - 10.00s): out=10.25 so hide() at out-0.20=10.05s keeps it 100% visible through 10.00s
      caption(9.30, 10.25, '<span class="nb">ตามที่เจ้าของโพสต์เล่า:</span> <span class="y">ถือ 2 ชม.</span><br><span class="nb">แต่ถูกปฏิเสธกำไรเกือบ</span> <span class="n">6 ล้านบาท!</span>');

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
