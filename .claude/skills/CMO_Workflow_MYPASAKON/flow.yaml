schema: mooniex.flow/v1
flow: mypasakon
name: MYPASAKON episode
skill: CMO_Workflow_MYPASAKON
owner: CMO
goal: Turn the CEO's recorded voice and brief into a Neon Green MYPASAKON episode with two /run checkpoints and minimal Lipsync spend.
output: A 1080x1920 30fps MYPASAKON episode queued to TikTok @mypasakon via MoonieX Poster and archived on Drive.
host: mac
trigger:
  kind: manual
  by: CEO
watcher: CMO@mac
budget:
  cash_usd: 1.50
phases:
  - {id: pre, name: Brief and script}
  - {id: voice, name: Voice trim and Gate 1}
  - {id: gen, name: Lipsync and B-roll}
  - {id: edit, name: Neon cut and Gate 2}
  - {id: ship, name: Queue and archive}
nodes:
  - id: script
    name: Script and folder
    does: Writes the episode Google Doc script inside the Drive folder and sends the 5-tag Topic/Tags/Script block.
    phase: pre
    kind: agent
    after: []
    role: cmo
    skill: CMO_Procedure_ClientScript_Handoff
    stage: agent
    output: ALL DRAFT/MYPASAKON/<Episode>/Script + 5-hashtag handoff block
    verify: {check: "Drive folder and shared Script Doc exist, and 5-tag Topic/Tags/Script block passed compliance"}
    gate: Script matches client brief and 5-hashtag rule (#MYPASAKON first).

  - id: script_ok
    name: Script approval
    does: The CEO (and client/broker when sponsored) approves the script before voice recording.
    phase: pre
    kind: human
    after: [script]
    approver: CEO
    verify: {human: CEO}
    gate: Script approved by CEO (and broker if client-sponsored).

  - id: raw_voice
    name: Raw voice upload
    does: The CEO drops the unedited voice file (.mp4/.mov/.m4a) and any screen recording into Audio/ on Drive.
    phase: voice
    kind: human
    after: [script_ok]
    approver: CEO
    output: ALL DRAFT/MYPASAKON/<Episode>/Audio/<raw_voice.mp4>
    verify: {check: "Raw voice file is readable on Drive and ffprobe reports a valid audio stream"}
    gate: Raw voice recording (and optional screen capture) is in Drive Audio/.

  - id: audio_trim
    name: Voice dead-air trim
    does: Extracts MP3, prunes dead air, false starts, repeated words and loops against the Script, at -14 LUFS.
    phase: voice
    kind: agent
    after: [raw_voice]
    role: video_editor
    skill: CMO_Standard_MYPASAKON_NeonDNA
    stage: agent
    output: MYPASAKON_<EP>_Trimmed_Clean.mp3 + edit_decision_list.json
    verify: {check: "tools/mypasakon_audio_trim.py render wrote edit_decision_list.json and ear-verified -14 LUFS MP3"}
    gate: Zero dead air or repeated takes; spoken meaning matches Script and client brief.
    blockers: [input, bug]
    measured:
      - {date: "2026-11-25", cost_usd: 0, minutes: 14.0, source: Q-20261125-1059-e579}

  - id: gate1_audio
    name: Gate 1 audio approval
    does: Sends the trimmed master audio to terminal.mooniex.com/run so the CEO approves pacing before Lipsync.
    phase: voice
    kind: human
    after: [audio_trim]
    approver: CEO
    verify: {human: CEO}
    gate: CEO taps ใช้ได้ on the Gate 1 /run media card (quoted in STATUS.md).
    on_fail: {retry_from: audio_trim, max: 3}

  - id: chunks_15s
    name: 15s avatar chunks
    does: Slices 3 x 15s phrase-aligned voice chunks (Hook, Mid, Close) from the Gate 1 master (or syncs demo lips).
    phase: gen
    kind: code
    after: [gate1_audio]
    tool: tools/mypasakon_audio_trim.py
    output: lipsync_chunks.json + 3 x 15s MP3 chunks (or sync_manifest.json in demo mode)
    verify: {check: "lipsync_chunks.json lists 3 phrase-aligned ~15s chunks (or sync_manifest.json has 0-frame drift)"}
    gate: Exactly 3 clean ~15s avatar chunks on natural phrase boundaries.
    blockers: [bug, input]

  - id: lipsync
    name: Avatar lipsync
    does: Lip-syncs the 3 x 15s avatar chunks (~45s total, ~$0.53); skipped at $0 when reusing demo lipsync clips.
    phase: gen
    kind: api
    after: [chunks_15s]
    tool: claudeflow:src/video/videogen.js
    provider: fal
    unit_cost: {usd: 0.0117, per: second, source: claudeflow:src/lib/cost-ledger.js, date: "2026-09-19"}
    output: AI Drafts/lip_1.mp4, lip_2.mp4, lip_3.mp4
    verify: {check: "All 3 avatar lipsync MP4s exist, match chunk durations, and pass mouth-sync spot check"}
    gate: All 3 avatar clips in sync with zero dead-air waste.
    blockers: [credit, key, upstream, money]

  - id: omni12_restyle
    name: Omni 1.2 1080p restyle
    does: Upgrades the 3 x 15s lipsync clips via Google Flow Omni 1.2 Flash into 1080p winter knit sweater & sharp studio.
    phase: gen
    kind: api
    after: [lipsync]
    tool: tools/flow_shoot_card.py
    provider: google-flow
    output: AI Drafts/omni_lip1_1080p.mp4, omni_lip2_1080p.mp4, omni_lip3_1080p.mp4
    verify: {cmd: "python tools/mypasakon_audio_trim.py sync-omni --omni <shot.mp4> --ref <lip.mp4> --out <omni_sync.mp4>"}
    gate: 1080x1920 winter knit sweater & studio clarity with 0ms FFT-locked mouth sync and intact face.
    blockers: [credit, login, money, upstream]
    measured:
      - {date: "2026-11-26", cost_usd: 0, minutes: 2.5, source: RUN-20261126-1015-8e87}

  - id: broll_footage
    name: Screen and Flow B-roll
    does: Preps real app/chart screen captures (Smart-Zoom 1:1 establish -> center zoom) plus optional Flow neon B-roll.
    phase: gen
    kind: agent
    after: [gate1_audio]
    role: video_editor
    skill: CMO_Standard_MYPASAKON_NeonDNA
    stage: agent
    output: Cropped/dark-graded B-roll clips keyed to script timestamps
    verify: {check: "Every non-avatar window has a real screen capture, kinetic card, or dark-emerald B-roll plate"}
    gate: Zero macOS Dock/Launchpad/PII leaks; white TradingView charts converted to dark mode.
    blockers: [input, quota]

  - id: compose_cut
    name: Viral x BL V7.8 cut
    does: Cuts the full 1080x1920 30fps episode in @mypasakon viral style + BL V7.8 GSAP motion, SFX and -24dB BGM.
    phase: edit
    kind: agent
    after: [omni12_restyle, broll_footage]
    role: video_editor
    skill: CMO_Procedure_MYPASAKON_Cut
    stage: agent
    output: Finals/MYPASAKON_<EP>_Viral_1080p.mp4
    verify: {check: "Rendered 1080x1920@30fps MP4 frame count matches trimmed master audio with 0 gaps"}
    gate: RVM hook/composite, headroom titles, PiP screen, GSAP motion, CTA ring, and -14 LUFS mix.
    blockers: [bug, verify_fail, quota]
    measured:
      - {date: "2026-11-25", cost_usd: 0, minutes: 12.0, source: Q-20261125-1018-c6f1}

  - id: qc_check
    name: Cut and visual QC
    does: Verifies 1080x1920@30fps, audio/video frame lock, -14 LUFS loudness, and writes the spread QC sheet.
    phase: edit
    kind: code
    after: [compose_cut]
    tool: tools/mypasakon_audio_trim.py
    output: qc_8frame_sheet.jpg + verify-cut JSON
    verify: {cmd: "python tools/mypasakon_audio_trim.py verify-cut --video <final.mp4> --audio <trimmed.mp3> --sheet <qc.jpg>"}
    gate: verify-cut exits 0 and visual inspection of QC sheet shows zero overlap or clipping.
    on_fail: {retry_from: compose_cut, max: 3}
    blockers: [verify_fail]

  - id: gate2_video
    name: Gate 2 video approval
    does: Sends the finished Neon cut to terminal.mooniex.com/run for the CEO to watch and approve on phone.
    phase: ship
    kind: human
    after: [qc_check]
    approver: CEO
    verify: {human: CEO}
    gate: CEO taps ใช้ได้ on the Gate 2 /run media card (quoted in STATUS.md).
    on_fail: {retry_from: compose_cut, max: 3}

  - id: publish
    name: Queue and Drive archive
    does: Uploads Final MP4 to Drive Finals/ (md5 verified) and queues to TikTok @mypasakon with 5 hashtags.
    phase: ship
    kind: agent
    after: [gate2_video]
    role: cmo
    skill: CMO_Rules_TikTok_Hashtags
    stage: agent
    output: Drive Finals/ MP4 + TikTok Draft & 5-hashtag Telegram card
    verify: {check: "Drive Finals/ upload md5 matches local MP4 and 5-hashtag TikTok queue succeeded"}
    gate: Final MP4 archived on Drive and queued for @mypasakon publish.
    release: true
    blockers: [login, upstream]
