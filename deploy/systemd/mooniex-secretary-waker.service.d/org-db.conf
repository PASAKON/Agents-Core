# Org Mesh W1.8: ORG_DB_URL for the secretary waker, from Infisical, not from a .env file.
# Why: lib/db.py uses Postgres as soon as ORG_DB_URL is in the process env
# (lib/db.py pg_url). No .env may be extended (CLAUDE.md §Secrets). The identity
# file /etc/infisical/contabo.env is root 0600 and this unit runs as User=secretary,
# so the fetch runs privileged (`+` on that one ExecStart), then setpriv drops to
# secretary before the service starts. setpriv execs, so systemd still supervises
# the service's own pid. The waker already uses the venv python.
# HOME is set explicitly: setpriv does not reset it, and the `+` command runs with
# full privileges, so the dropped process must not inherit root's HOME.
# The unit's two EnvironmentFile= lines stay: they hold other secrets, and moving
# them is PLAN §6 phase 3.
# Design: docs/design/org-mesh-w18-contabo-consumers.md
# Installed only by scripts/hub/contabo-cutover-remote.sh step 4, inside the W1.10
# window. Never install it before the migration.
# Rollback: rm /etc/systemd/system/mooniex-secretary-waker.service.d/org-db.conf
#   && systemctl daemon-reload && systemctl restart mooniex-secretary-waker
[Service]
Environment=HOME=/home/secretary
ExecStart=
ExecStart=+/usr/bin/python3 /opt/MoonieXHQ/Agents/Core/tools/infisical_setup.py run Agents-Core prod --as contabo -- /usr/bin/setpriv --reuid=secretary --regid=secretary --init-groups -- /opt/MoonieXHQ/Agents/Core/.venv/bin/python -m runners.secretary_waker
