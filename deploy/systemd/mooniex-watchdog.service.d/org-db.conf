# Org Mesh W1.8: ORG_DB_URL for the watchdog, from Infisical, not from a .env file.
# Why: lib/db.py uses Postgres as soon as ORG_DB_URL is in the process env
# (lib/db.py pg_url). No .env may be extended (CLAUDE.md §Secrets), so the unit
# starts through `infisical_setup.py run Agents-Core prod`, which fetches the
# project's secrets and execs the daemon with them. The identity file
# /etc/infisical/contabo.env is root 0600 and this unit runs as root.
# Design: docs/design/org-mesh-w18-contabo-consumers.md
# Installed only by scripts/hub/contabo-cutover-remote.sh step 4, inside the W1.10
# window. Never install it before the migration: the unit would write to Postgres
# while the rest of Contabo is still on state/tasks.db.
# Rollback: rm /etc/systemd/system/mooniex-watchdog.service.d/org-db.conf
#   && systemctl daemon-reload && systemctl restart mooniex-watchdog
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/MoonieXHQ/Agents/Core/tools/infisical_setup.py run Agents-Core prod --as contabo -- /opt/MoonieXHQ/Agents/Core/.venv/bin/python -m runners.watchdog --loop
