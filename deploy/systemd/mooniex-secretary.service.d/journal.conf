# task-4c7b0b9d: the secretary must leave a trace in the journal.
# Why: `journalctl -u mooniex-secretary` printed "-- No entries --" on 2026-10-15, so a
# "0 errors in 24 h" check on this unit could not fail. Measured the same day: output was
# already reaching journald (fd 1 and 2 of the python pid were /run/systemd/journal/stdout
# sockets, effective StandardOutput=journal, StandardError=inherit, both systemd defaults);
# the unit had run since 2026-10-01 23:56 CEST, the journal only reaches back to
# 2026-10-09 04:40 CEST, and an idle secretary writes nothing after its start line.
# This drop-in pins the output so a change to the manager defaults (DefaultStandardOutput=
# in system.conf) cannot move it silently, turns off Python's 8 KiB stdout buffer for any
# bare print(), tags the lines with the unit name, and keeps journald reading the "<N>"
# priority prefix the code now writes (runners/secretary_server.py use_journal_levels).
# The code side (start line, hourly heartbeat, logged exceptions) is in
# runners/secretary_server.py. Report: docs/reports/task-4c7b0b9d/REPORT.md.
# Rollback: rm /etc/systemd/system/mooniex-secretary.service.d/journal.conf
#   && systemctl daemon-reload && systemctl restart mooniex-secretary
[Service]
StandardOutput=journal
StandardError=journal
SyslogIdentifier=mooniex-secretary
SyslogLevelPrefix=yes
Environment=PYTHONUNBUFFERED=1
