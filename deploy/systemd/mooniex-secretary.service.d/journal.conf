# Route stdout and stderr to the systemd journal and force unbuffered Python
# stdio so startup and error log lines reach journald immediately (task-08129e34).
# Rollback: rm /etc/systemd/system/mooniex-secretary.service.d/journal.conf
#   && systemctl daemon-reload && systemctl restart mooniex-secretary
[Service]
StandardOutput=journal
StandardError=journal
Environment=PYTHONUNBUFFERED=1
