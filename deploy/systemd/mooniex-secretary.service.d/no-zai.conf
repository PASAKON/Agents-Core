# SomPong runs on the secretary user's Claude Max OAuth (CEO 2026-09-09:
# "brain = Claude subscription"; Z.ai removed CEO 2026-09-20, commit 677d42ff).
# The env files still carried the Z.ai pin (ANTHROPIC_BASE_URL=api.z.ai,
# ANTHROPIC_MODEL=glm-5.2, the Z.ai token), so every turn on LINE and Telegram
# hit "GLM Coding Plan package has expired" (429/1309) on 2026-10-01.
# UnsetEnvironment= is applied last, after both EnvironmentFile= lines, so this
# strips the pin without touching the secrets file. With no env token,
# _bare_is_safe() drops --bare and claude reads ~/.claude/.credentials.json.
[Service]
UnsetEnvironment=ANTHROPIC_BASE_URL ANTHROPIC_MODEL ANTHROPIC_AUTH_TOKEN ANTHROPIC_API_KEY ZAI_API_KEY
