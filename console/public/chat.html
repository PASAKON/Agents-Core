<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>MoonieX Console — chat</title>
<link rel="stylesheet" href="/css/console.css" />
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
</head>
<body>
<div class="chat-win">
  <div class="titlebar">
    <a class="back-btn" href="/" title="Back to sessions">‹</a>
    <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
    <div class="title"><span class="conn-dot connecting" id="conn-dot"></span><span id="win-title">connecting…</span></div>
  </div>
  <div class="term-wrap">
    <div id="terminal"></div>
  </div>
  <div class="composer">
    <div class="inputline">
      <span class="prompt">&gt;</span>
      <input id="composer-input" type="text" placeholder="พิมพ์ถึง agent…" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button id="btn-send" class="send">⏎</button>
    </div>
    <div class="keys">
      <span class="key" data-key="esc">esc</span>
      <span class="key" data-key="tab">tab</span>
      <span class="key" data-key="ctrl-c">⌃C</span>
      <span class="key" data-key="up">↑</span>
      <span class="key" data-key="down">↓</span>
      <span class="key" data-key="enter">⏎</span>
    </div>
  </div>
</div>
<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/xterm-addon-fit/lib/addon-fit.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
