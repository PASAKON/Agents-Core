<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MoonieX Console — sessions</title>
<link rel="stylesheet" href="/css/console.css" />
</head>
<body>
<div class="win page">
  <div class="titlebar">
    <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
    <div class="title" id="win-title">sessions</div>
  </div>
  <div class="body">
    <div class="topbar">
      <span class="yellow bold">ACTIVE SESSIONS</span>
      <button class="logout" id="btn-logout">sign out</button>
    </div>
    <div class="dim" style="font-size:11px;margin-bottom:4px;">(tmux ls)</div>

    <div id="session-list"></div>
    <div id="empty-note" class="empty-note" hidden>no live sessions yet — create one below.</div>

    <div class="create-panel">
      <button id="btn-create" class="btn">＋ Create New Session</button>
      <div class="dim" style="font-size:11px;margin-top:10px;">เลือก role:</div>
      <div class="chips" id="role-chips"></div>
      <div class="field-row">
        <label for="new-name">ตั้งชื่อ (optional)</label>
        <input id="new-name" type="text" placeholder="e.g. contabo-migration" autocapitalize="none" autocorrect="off" spellcheck="false" />
      </div>
      <div id="create-status" class="status-line"></div>
    </div>

    <div class="dim" style="font-size:10.5px;margin-top:14px;">─ แตะ session = เข้า chat · เลือก role + ตั้งชื่อ = เปิดใหม่ ─</div>
  </div>
</div>
<script src="/js/sessions.js"></script>
</body>
</html>
