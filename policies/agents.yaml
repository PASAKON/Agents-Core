# Role registry. Level: c (C-level), m (manager), w (worker).
# Permissions enforced by tools/* gates.

defaults:
  permission_mode: acceptEdits
  max_iterations: 3

roles:
  ceo:
    display: CEO
    level: c
    model: null            # the user — no LLM
    can_write_wiki: true
    can_merge: true
    can_push: true

  cto:
    display: CTO
    level: c
    model: claude-opus-4-7
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true

  developer:
    display: Developer
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  tester:
    display: Tester
    level: w
    model: claude-haiku-4-5
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  web_designer:
    display: Web Designer
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  devops_engineer:
    display: DevOps Engineer
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  security_engineer:
    display: Security Engineer
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  data_analyst:
    display: Data Analytics
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

  prompt_engineer:
    display: Prompt Engineer
    level: w
    model: claude-sonnet-4-6
    can_write_wiki: false
    can_create_task: false
    can_merge: false
    can_push: false
    workspace_only: true

c_level: [ceo, cto]
