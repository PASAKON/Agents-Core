    # onto GLM: this role's work is screenshot-driven and needs vision.
    # Chrome access is gated on the --chrome flag in runners/worker_init.py.
    model: "claude-sonnet-5-5"   # Sonnet workers -> Sonnet 5.5 (CEO 2026-09-29), same price as Sonnet 5
    effort: "high"
    can_write_wiki: false
