# Role registry. Level: c (C-level), m (manager), w (worker).
# Permissions enforced by tools/* gates.

defaults:
  permission_mode: acceptEdits
  max_iterations: 3

roles:
  ceo:
    display: CEO
    level: c
    model: null            # the user — no LLM
    can_write_wiki: true
    can_merge: true
    can_push: true

  cto:
    display: CTO
    level: c
    # Default = Claude. GLM-5.1 offload is opt-in + flag-gated via
    # CXO_MODEL_PROVIDER (see lib.config.cxo_provider_overrides); leaving a
    # non-Claude id here would leak to the Anthropic API on the REPL path.
    # Sonnet 5 default + Opus 5 escalation via the session-change-model
    # skill (decisions/0009-model-routing-policy.md).
    model: "claude-sonnet-5"
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true

  cfo:
    display: CFO
    level: c
    model: "claude-sonnet-5"
    fallback_model: "claude-fable-5"
    effort: "high"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true

  cgo:
    display: CGO
    level: c
    model: "claude-sonnet-5"
    fallback_model: "claude-fable-5"
    effort: "high"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true

  cmo:
    display: CMO
    level: c
    model: "claude-sonnet-5"
