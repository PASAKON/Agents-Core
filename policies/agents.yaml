# Role registry. Level: c (C-level), m (manager), w (worker).
# Permissions enforced by tools/* gates.

defaults:
  permission_mode: acceptEdits
  max_iterations: 3

roles:
  ceo:
    display: CEO
    level: c
    model: null            # the user — no LLM
    can_write_wiki: true
    can_merge: true
    can_push: true
    skills_profile: all

  cto:
    display: CTO
    level: c
    # Claude only: the GLM/Z.ai/9Router offload was removed 2026-09-23 (CEO,
    # 2026-09-20). A non-Claude id here would go straight to the Anthropic API.
    # Org standard since 2026-09-23 (CEO): every C-level runs Opus 5.5 with
    # the 1M context window at xhigh — the same pick the CEO makes with
    # /model. Workers already on Sonnet stay on Sonnet. ADR 0009 addendum
    # 2026-09-23 (decisions/0009-model-routing-policy.md). Sonnet workers
    # moved Sonnet 5 -> Sonnet 5.5 on 2026-09-29 (CEO): same $2/$10 price,
    # same tokenizer; smoke-tested on Claude Code 2.1.284 (1M context).
    model: "claude-opus-5-5[1m]"
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true
    # CEO decision (ADR 0022 §2): CTO sees every skill. "all" is read by
    # runners/worker_init.py._skill_visibility_overlay(), which emits no
    # file and passes no flag for it -- this decision costs zero code.
    skills_profile: all

  cfo:
    display: CFO
    level: c
    model: "claude-opus-5-5[1m]"   # org standard 2026-09-23, see cto
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true
    skills_profile: all

  cgo:
    display: CGO
    level: c
    model: "claude-opus-5-5[1m]"   # org standard 2026-09-23, see cto
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true
    skills_profile: all

  cmo:
    display: CMO
    level: c
    # CEO 2026-09-30: CMO leaves the Opus C-level standard for Sonnet 5.5
    # (1M) @ xhigh — it runs the automation lane (browse work driven by AGY).
    # Smoke-tested headless the same day: claude -p answered OK on this id.
    model: "claude-sonnet-5-5[1m]"
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true
    skills_profile: all

  # Created 2026-09-27 (CEO: 'ตั้ง COO ให้เลย'); role doc roles/coo.md.
  # The COO IS SomPong (CEO 2026-10-01): ONE always-on session, Contabo only
  # (tmux `sompong`, mooniex-sompong.service, /spawn-coo), personal manager of
  # the CEO and his family. cxo-claude.sh refuses --role coo anywhere else;
  # docs/design/sompong-coo-session.md. Same powers as the other C-levels.
  # Adding a C-level is this entry plus its key in `c_level` below -- the code
  # reads the roster from there (lib/roles.py); tests/test_c_level_roles.py
  # fails if any spot misses it.
  coo:
    display: COO
    level: c
    model: "claude-opus-5-5[1m]"   # org standard 2026-09-23, see cto
    fallback_model: "claude-fable-5"
    effort: "xhigh"
    can_write_wiki: true
    can_create_task: true
    can_merge: true
    can_push: true
    can_delete_branch: true
    skills_profile: all

