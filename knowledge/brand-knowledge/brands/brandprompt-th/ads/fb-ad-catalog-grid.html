<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>BrandPrompt TH — FB Ad: Catalog Grid / Variety (4:5)</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans Thai";
    src: url("../../../fonts/IBMPlexSansThai-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Sans Thai";
    src: url("../../../fonts/IBMPlexSansThai-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }

  :root {
    --ink: #241e1a;
    --paper: #f7f0e2;
    --clay: #c1502c;
    --clay-light: #d4693f;
    --clay-dark: #9c3d22;
    --sand: #e7d9bf;
    --taupe: #8b7e6a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .ad {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
  }

  /* ---------- logo row ---------- */
  .brandrow {
    position: absolute;
    top: 52px;
    left: 56px;
    right: 56px;
    height: 64px;
    display: flex;
    align-items: center;
  }
  .logo-stamp {
    width: 64px;
    height: 64px;
    border-radius: 15px;
    overflow: hidden;
    flex: 0 0 auto;
    box-shadow: 0 4px 10px rgba(36,30,26,0.14);
  }
  .logo-stamp img { width: 100%; height: 100%; display: block; }
  .brand-word {
    margin-left: 18px;
    font-size: 27px;
    font-weight: 600;
    color: var(--ink);
  }
  .brand-word .accent { color: var(--clay); }

  /* ---------- headline ---------- */
  .headline {
    position: absolute;
    top: 148px;
    left: 56px;
    right: 56px;
    height: 176px;
  }
  .headline h1 {
    margin: 0;
    font-size: 62px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }
  .headline h1 .accent { color: var(--clay); }
  .headline p {
    margin: 14px 0 0;
    font-size: 26px;
    font-weight: 400;
    color: var(--taupe);
  }

  /* ---------- catalog grid (hero) ---------- */
  .grid-wrap {
    position: absolute;
    top: 356px;
    left: 56px;
    right: 56px;
    height: 908px;
  }
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 13px;
  }
  .tile {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: var(--sand);
  }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- price corner element ---------- */
  .price-tag {
    position: absolute;
    right: -14px;
    bottom: -18px;
    background: var(--paper);
    border-radius: 999px;
    padding: 14px 26px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    box-shadow: 0 10px 26px rgba(36,30,26,0.32);
    border: 2px solid var(--sand);
  }
  .price-tag .old {
    font-size: 24px;
    font-weight: 400;
    color: var(--taupe);
    text-decoration: line-through;
    text-decoration-color: var(--taupe);
    text-decoration-thickness: 2px;
  }
  .price-tag .arrow {
    font-size: 22px;
    color: var(--taupe);
  }
  .price-tag .new {
    font-size: 32px;
    font-weight: 600;
    color: var(--clay);
  }
  .price-tag .unit {
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
  }
</style>
</head>
<body>
<div class="ad">

  <div class="brandrow">
    <div class="logo-stamp"><img src="../images/logo-mark.png" alt="BrandPrompt TH logo mark" /></div>
    <div class="brand-word">Brand<span class="accent">Prompt</span> TH</div>
  </div>

  <div class="headline">
    <h1><span class="accent">100 แบบ</span> พร้อมใช้<br/>เลือกได้ทุกธุรกิจ</h1>
    <p>คาเฟ่ · คลินิก · ร้านเสริมสวย · อสังหาฯ · และอีกมากมาย</p>
  </div>

  <div class="grid-wrap">
    <div class="grid">
      <div class="tile"><img src="../../../../output/brandprompt-th/round1/cafe-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round2/jewelry-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round1/fitness-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round3/beautyclinic-1.png" alt="" /></div>

      <div class="tile"><img src="../../../../output/brandprompt-th/round1/skincare-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round2/wedding-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round1/restaurant-3.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round3/barber-1.png" alt="" /></div>

      <div class="tile"><img src="../../../../output/brandprompt-th/round1/bakery-2.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round2/usedcars-2.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round3/tour-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round1/fashion-3.png" alt="" /></div>

      <div class="tile"><img src="../../../../output/brandprompt-th/round3/craft-1.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round1/realestate-2.png" alt="" /></div>
      <div class="tile"><img src="../../../../output/brandprompt-th/round3/pharmacy-1.png" alt="" /></div>
      <div class="tile">
        <img src="../../../../output/brandprompt-th/round1/dental-3.png" alt="" />
        <div class="price-tag">
          <span class="old">990</span>
          <span class="arrow">&rarr;</span>
          <span class="new">500</span>
          <span class="unit">บาท</span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
