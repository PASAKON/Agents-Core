<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE165"/>
      <stop offset=".5" stop-color="#F7C440"/>
      <stop offset="1" stop-color="#E49C1D"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#14306A"/>
      <stop offset=".7" stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#050C1E"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset=".6" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#F3CF72"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2445"/>
      <stop offset="1" stop-color="#0A0912"/>
    </linearGradient>
    <clipPath id="L"><rect x="0" y="0" width="200" height="400"/></clipPath>
    <clipPath id="R"><rect x="200" y="0" width="200" height="400"/></clipPath>
  </defs>
  <circle cx="200" cy="206" r="182" fill="url(#bg)"/>
  <circle cx="200" cy="206" r="182" fill="none" stroke="url(#gm)" stroke-width="9"/>
  <circle cx="200" cy="206" r="167" fill="none" stroke="url(#gm)" stroke-width="2.5"/>
  <!-- kranok flame finial breaking the ring at 12 o'clock -->
  <path d="M200 0 C 216 20 220 34 209 50 C 207 40 203 35 200 32 C 197 35 193 40 191 50 C 180 34 184 20 200 0 Z" fill="url(#gm)" stroke="#0A1A38" stroke-width="2"/>
  <!-- good side: three small sparkles -->
  <g fill="url(#gm)">
    <path d="M112 118 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 Z"/>
    <path d="M86 168 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
    <path d="M140 86 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 Z"/>
  </g>
  <!-- lotus: left petals light (good), right petals dark and thorned (evil) -->
  <g stroke="url(#gm)" stroke-width="3" stroke-linejoin="round">
    <path d="M200 262 C 150 266 110 246 92 208 C 140 202 182 228 200 262 Z" fill="url(#cream)"/>
    <path d="M200 262 C 250 266 290 246 308 208 C 260 202 218 228 200 262 Z" fill="url(#dark)"/>
    <path d="M200 260 C 158 248 132 208 134 156 C 170 174 196 214 200 260 Z" fill="url(#cream)"/>
    <path d="M200 260 C 242 248 268 208 266 156 C 230 174 204 214 200 260 Z" fill="url(#dark)"/>
    <g>
      <path clip-path="url(#L)" d="M200 262 C 170 226 172 168 200 124 C 228 168 230 226 200 262 Z" fill="url(#cream)"/>
      <path clip-path="url(#R)" d="M200 262 C 170 226 172 168 200 124 C 228 168 230 226 200 262 Z" fill="url(#dark)"/>
      <path d="M200 262 C 170 226 172 168 200 124 C 228 168 230 226 200 262 Z" fill="none"/>
      <path d="M200 132 L200 258" stroke-width="2"/>
    </g>
  </g>
  <!-- thorns on the dark petals -->
  <g fill="url(#gm)">
    <path d="M262 186 l14 -4 l-10 11 Z"/>
    <path d="M252 218 l13 1 l-11 8 Z"/>
    <path d="M294 226 l12 2 l-10 7 Z"/>
    <path d="M276 246 l11 4 l-12 4 Z"/>
    <path d="M221 196 l10 -4 l-7 9 Z"/>
  </g>
  <!-- drips under the dark side -->
  <g fill="#0A0912" stroke="url(#gm)" stroke-width="2">
    <path d="M262 262 C 262 262 255 274 255 279 a7 7 0 0 0 14 0 C 269 274 262 262 262 262 Z"/>
    <path d="M286 254 C 286 254 281 262 281 266 a5 5 0 0 0 10 0 C 291 262 286 254 286 254 Z"/>
  </g>
  <!-- water line -->
  <path d="M112 270 Q 200 292 288 270" fill="none" stroke="url(#gm)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="345" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="62" letter-spacing="8" fill="url(#gm)">ILAG</text>
</svg>
