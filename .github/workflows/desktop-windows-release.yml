name: MoonieX Desktop Windows Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and draft signed Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: "MoonieX Desktop v__VERSION__"
          releaseBody: "Signed Windows installer and automatic-update metadata. Publish this draft after validation."
          releaseDraft: true
          prerelease: false

      - name: Normalize updater download URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $metadataPath = Join-Path $env:RUNNER_TEMP "latest.json"
          gh release download $tag --pattern latest.json --dir $env:RUNNER_TEMP --clobber

          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was attached to $tag"
          }

          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($installer.name)"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $metadata.platforms.PSObject.Properties.Value | ForEach-Object { $_.url = $downloadUrl }
          $metadata | ConvertTo-Json -Depth 8 | Set-Content $metadataPath -Encoding utf8
          gh release upload $tag "$metadataPath#latest.json" --clobber
