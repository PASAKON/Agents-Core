name: CI

# ADR 0021 §5 + ADR 0020 §2 — one workflow, three report jobs.
# Green is the precondition before merge_task on this repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. The test suite from pytest.ini (evals are --ignored there, so this is
  #    side-effect-free by construction).
  pytest:
    runs-on: ubuntu-latest
    # tests/test_db_backend_pg.py (15 tests) self-skips without
    # ORG_TEST_DB_URL -- this service + the env var on the pytest step below
    # give it a real Postgres 16 so those tests actually run in CI instead of
    # only ever running on a dev's local throwaway container (task brief
    # gap 4, docs/design/tasks-db-hub.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: org_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # repo's Python (ADR 0021: "use the repo's existing Python version")
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # tests/ is collected since 2026-09-23: flow_shoot tests probe clips with
      # ffmpeg/ffprobe (installed on the Mac, absent on ubuntu-latest).
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Run pytest
        # Tests build throwaway git repos and commit into them; the runner has
        # no git identity ("Author identity unknown" in 5+ tests).
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@agents.local
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@agents.local
          ORG_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/org_test
        run: pytest

  # 2. gitleaks — mirrors the repo's pre-commit guard
  #    (.git/hooks/pre-commit: `gitleaks protect --staged --redact --no-banner`,
  #    added 2026-07-23). The repo ships no tracked .gitleaks.toml, so the
  #    action scans with gitleaks' built-in default ruleset. Fails the job on
  #    any finding, the same way the hook blocks the commit.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. osv-scanner — ADR 0020 §2. Scans requirements.txt AND any package.json
  #    via --recursive (e.g. knowledge/.../bird-search/package.json). Report
  #    only: NO --upgrade / `osv fix` (upgrading a dependency is a human
  #    decision).
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # google/osv-scanner-action is a MONOREPO holding two sub-actions
      # (osv-scanner-action, osv-reporter-action), so the path repeats and a
      # bare `@v2` does not resolve — the first CI run failed with
      # "unable to find version `v2`". Pin a real released tag.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            ./

  # 4. Repo guards for what every machine pushes. The pre-commit hooks are
  #    local (.git/hooks, scripts/install-git-hooks.sh) and were never on every
  #    box: six media files over 1 MiB reached main from Contabo after the
  #    2026-09-23 guard, and an unresolved merge conflict sat in a tracked doc
  #    (docs/prompts/absence/CHECKLIST.md, found 2026-10-01).
  repo-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: pip install pyyaml
      - name: Unresolved merge conflict markers
        run: python scripts/conflict_marker_guard.py
      - name: New media over the media_guard limit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "media_guard: no base commit to compare against; skipped"
            exit 0
          fi
          python scripts/media_guard.py --since "$BASE_SHA"
