# pytest configuration — ADR 0021 §2/§3.
#
# testpaths scopes discovery to scripts/ + lib/. The --ignore list excludes
# every file classified as eval/harness (NOT marked — a marker would require
# editing each file, which ADR 0021 §3 forbids). Three sub-categories:
#   (a) eval  — a test body does real work with side effects outside tmp_path
#               (writes state/tasks.db, state/locks/, output/, the real wiki
#               root, ~/.claude/; hits network / paid API / real service).
#   (b) import — collecting the file mutates the tree at import/collection
#               time (e.g. test_tool_parity imports runners.cto, whose module-
#               level get_logger("cto") creates state/logs/cto.log).
#   (c) harness — def test_*(tmp) -> bool signature run via `python <file>`;
#               pytest resolves `tmp` as a missing fixture (setup ERROR), so
#               the body never runs. Designed for __main__, not pytest.
[pytest]
testpaths = scripts lib
addopts =
    -q
    --ignore=scripts/test_auto_deploy.py
    --ignore=scripts/test_depends_on_enforcement.py
    --ignore=scripts/test_designer_spawn_guard.py
    --ignore=scripts/test_maintab.py
    --ignore=scripts/test_org_tools_registry.py
    --ignore=scripts/test_owner_cto_routing.py
    --ignore=scripts/test_spawn_tab_routing.py
    --ignore=scripts/test_tab_title.py
    --ignore=scripts/test_tm_prompt_loop.py
    --ignore=scripts/test_tool_parity.py
    --ignore=scripts/test_trader_mindset_batch.py
    --ignore=scripts/test_watchdog_reap.py
    # --- QUARANTINE: not evals. Ordinary tests with a real isolation bug --
    # they open state/tasks.db at its real path, which is gitignored, so no
    # worktree and no CI checkout can pass them. Tracked in GH #56; each fix
    # removes one line and this block is meant to reach zero. Do NOT add to
    # this block without an issue number.
    --ignore=scripts/test_terminal_restart.py
    --ignore=lib/test_recall.py
    --ignore=lib/test_reflect.py
markers =
    eval: test/harness that does real work with real side effects (ADR 0021 §3); excluded from the default run via --ignore today, reserved for future per-file marking once evals are relocated
