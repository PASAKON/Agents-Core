# Phase C1: only capacities already reviewed in hosts.yaml are enabled.
# Disabled literals are design proposals, not provider entitlements.
version: 1
defaults:
  heartbeat_s: 5
  max_hold_s: 300
  priority_classes: {ceo: 0, urgent: 5, normal: 10, background: 20}
  queue_cap: 1000
  on_hub_down: fail_closed
  needs_ceo_card: false
  paid: false
  wake: {waiter: owner_session, fallback: owner_cto}
resources:
  - {pattern: 'chatgpt:<host>:<port>', alias: 'chrome:<host>:<port>', enabled: false}
  - {pattern: 'chrome:<host>:<port>', kind: mutex, capacity: 1, max_hold_s: 1800, enabled: false}
  - {pattern: 'host:<host>:workers', kind: pool, capacity_from: 'hosts.<host>.max_workers', max_hold_s: 3600}
  - {pattern: 'host:<host>:disk', kind: pool, capacity: 1, admission: fresh_disk_band, max_hold_s: 3600, enabled: false}
  - {name: 'host:contabo:cpu-exception', kind: mutex, capacity: 1, max_hold_s: 3600, enabled: false}
  - {pattern: 'proj:<project>:path:<path>', kind: mutex, capacity: 1, max_hold_s: 3600, enabled: false}
  - {pattern: 'quota:<bucket>', kind: rate, rate_from: 'verified_quotas.<bucket>', paid: true, max_hold_s: 3600, enabled: false}
  - {pattern: 'browser_operator:<host>', kind: pool, capacity_from: 'hosts.<host>.max_browser_operators', max_hold_s: 1800}
  - {pattern: 'render:<host>', kind: mutex, capacity: 1, admission: fresh_ram_cpu, max_hold_s: 3600, enabled: false}
  - {pattern: 'ph:<owner>:workers', kind: pool, capacity: 2, max_hold_s: 3600, enabled: false}
