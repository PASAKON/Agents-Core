# Host registry — Phase 1 of docs/design/multi-host-workers.md.
#
# Declares WHAT each host provides and HOW to reach it. No router reads
# `provides` yet (that's Phase 3) — hosts.yaml just declares them so Phase 3
# has something to match against later.
#
# `ssh` is the alias tools/delegate.py shells out to (must match a Host
# entry in ~/.ssh/config on the Mac) — null on mac itself, which never
# dials out to reach itself.
#
# `mesh_ssh` is where an Org Mesh call goes (lib/mesh.py, W2.8):
# `user@<tailnet address>`, dialled with `ssh -F none` and the org_dispatch key
# only, so no ssh config and no admin key is ever involved. It must be the
# TAILNET address: the far side's authorized_keys `from=` pins each
# dispatcher's tailnet address. null = no mesh calls to this host.
#
# `agents_root` / `worktrees` are host-native absolute paths (Windows paths
# use backslashes, quoted so YAML doesn't need double-escaping).
#
# `terminal_window` (CEO 2026-10-15): false = a NEW session on this host starts
# as a detached tmux session and opens no terminal window (no iTerm, no
# osascript); it still shows in the Claude app through `remote_control`. A
# missing key means true. Running sessions are never touched. To get a window
# for a session anyway: scripts/terminal-open.sh <id>, on that host.
# Read by lib.config.terminal_window().

hosts:
  mac:
    chrome_device_id: 35a05d33-19a5-4d2e-bab0-08503bad0a9b   # 'Browser 1 (macOS)' in list_connected_browsers
    chrome_name: mac-chrome
    os: darwin
    remote_control: true   # session shows in the CEO Claude app
    terminal_window: false   # CEO 2026-10-15: works from the Claude app, travels; no iTerm window on a new session
    ssh: null
    # Mac sshd stays closed until G2 (Remote Login + sshd hardening, at the end).
    mesh_ssh: null
    agents_root: /Users/gob/MoonieXHQ/Agents/Core
    worktrees: /Users/gob/MoonieXHQ/Agents/Core/worktrees
    provides: [chrome, macos_cu, blender_bridge]
    max_workers: 4
    # Worker CLI(s) this host can spawn (task-adbc6f43). claude and agy are
    # supported locally — agy is wired via runners/agy_local.py (2026-09-29).
    # codex is not signed in on Mac (use contabo).
    runners: [claude, agy]
    # ADDENDUM 3 (CTO 2026-09-07): CEO rule — one operator, one Chrome tab,
    # never a pile-up. Four operators sharing the Mac's Chrome produced a
    # destroyed tab group, a sign-out, and two blocked runs the same day.
    max_browser_operators: 2

  winbox:
    chrome_device_id: 815ddf16-36ea-4e0d-827a-f51e9ff85351   # winbox Chrome (worker verified via navigator.userAgent 2026-09-07; 70bf3142-… is Edge)
    chrome_name: winbox-chrome
    os: windows
    # OrgMesh KIT (mesh_check): the clones live under the repo dir, not under hq/Agents.
    kit_paths:
      core: C:/Users/passg/mooniex/repo/MoonieX-Agents
      rules: C:/Users/passg/mooniex/repo/Agents-Rules
      wikis: C:/Users/passg/mooniex/repo/Agents-Wikis
      memory: C:/Users/passg/mooniex/repo/Agents-Memory
    remote_control: true   # session shows in the CEO Claude app
    ssh: winbox
    mesh_ssh: passg@100.124.196.11
    agents_root: 'C:\Users\passg\mooniex'
    worktrees: 'C:\Users\passg\mooniex\worktrees'
    provides: [chrome, blender, win_gui]
    # CEO 2026-09-09: "เปิดไม่เกิน 2 Worker ก็พอแล้ว" — two on winbox is inside
    # that rule; the second is a read-only tab (tab_registry keeps them apart).
    max_workers: 2
    max_browser_operators: 2
    # Measured 2026-09-20, RECONCILED 2026-09-22 (CTO REVIEW-ITER2.md, doc
    # commit 0d8490f9): claude.exe (.local\bin, working), codex.cmd
    # (%APPDATA%\npm, codex-cli 0.153.4, signed in), agy.exe
    # (%LOCALAPPDATA%\agy\bin, Antigravity 1.2.6) -- ALL THREE confirmed
    # present and signed in on winbox, `agy models` returns all 14 models
    # when run in session 1. docs/ops/agent-runners.md §1's old "Mac only"
    # line for agy was stale (fixed in §6a); the credential lives in the
    # session-1 logon keyring, same session-0 boundary as codex's sandbox
    # pipe -- over plain ssh agy still says "Please sign in", which is
    # expected, not a sign of absence.
    runners: [claude, codex, agy]

  contabo:
    os: linux
    remote_control: true   # session shows in the CEO Claude app
    ssh: mooniex-vps
    # mooniex-vps dials Contabo's public address; the mesh needs the tailnet one.
    mesh_ssh: root@100.118.171.23
    # The pre-2026-09-23 flat Contabo path is now a compat symlink onto
    # agents_root below (removed ~2026-10-01) -- the real checkout is here,
    # on main, remote git@github.com:PASAKON/Agents-Core.git
    # (verified 2026-09-25, task-a5c0549d).
    agents_root: /opt/MoonieXHQ/Agents/Core
    worktrees: /opt/MoonieXHQ/Agents/Core/worktrees
    provides: [always_on, api, ffmpeg, playwright_chromium, node20]
    max_workers: 3
    # Where Claude Code keeps one <pid>.json per live session (tools/live_sessions.py).
    # Replaces the default <config>/sessions. SomPong runs as unix user sompong.
    claude_session_dirs: [/root/.claude/sessions, /home/sompong/.claude/sessions]
    # Hosts whose registry this host's publisher reads over ssh (hosts.<name>.ssh),
    # because they have no hub route of their own: winbox has no venv, so
    # windows_hub_prefix() is None there (tools/live_sessions.py pull_remote).
    live_sessions_pull: [winbox]
    # 0 until 2026-09-25: Contabo had no Chrome. The Console's Browser Homes (headless Chrome per
    # account, relay-login §1) give it one, so one operator at a time (cto-885ae930, Infisical P1).
    max_browser_operators: 1
    # Phase 2 (task-a5c0549d, docs/design/multi-host-workers.md §4): wired via
    # scripts/spawn-worker-remote.sh + tools.delegate._spawn_remote's linux
    # branch. codex (/usr/bin/codex) and agy (/root/.local/bin/agy) verified
    # on the box (2026-09-29).
    runners: [claude, codex, agy]
