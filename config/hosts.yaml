# Host registry — Phase 1 of docs/design/multi-host-workers.md.
#
# Declares WHAT each host provides and HOW to reach it. No router reads
# `provides` yet (that's Phase 3) — hosts.yaml just declares them so Phase 3
# has something to match against later.
#
# `ssh` is the alias tools/delegate.py shells out to (must match a Host
# entry in ~/.ssh/config on the Mac) — null on mac itself, which never
# dials out to reach itself.
#
# `agents_root` / `worktrees` are host-native absolute paths (Windows paths
# use backslashes, quoted so YAML doesn't need double-escaping).

hosts:
  mac:
    chrome_device_id: 35a05d33-19a5-4d2e-bab0-08503bad0a9b   # 'Browser 1 (macOS)' in list_connected_browsers
    chrome_name: mac-chrome
    os: darwin
    remote_control: true   # session shows in the CEO Claude app
    ssh: null
    agents_root: /Users/gob/Projects/Agents
    worktrees: /Users/gob/Projects/Agents/worktrees
    provides: [chrome, macos_cu, blender_bridge]
    max_workers: 4
    # Worker CLI(s) this host can spawn (task-adbc6f43). runners/worker_init.py
    # (the Mac-local launcher) only execs claude today — codex/agy on Mac is
    # docs/ops/agent-runners.md's own future work, not wired into this repo
    # yet. Defaults to [claude] when absent (lib.config.host_runners /
    # tools.delegate._host_runners), so leaving this out changes nothing.
    runners: [claude]
    # ADDENDUM 3 (CTO 2026-09-07): CEO rule — one operator, one Chrome tab,
    # never a pile-up. Four operators sharing the Mac's Chrome produced a
    # destroyed tab group, a sign-out, and two blocked runs the same day.
    max_browser_operators: 2

  winbox:
    chrome_device_id: 815ddf16-36ea-4e0d-827a-f51e9ff85351   # winbox Chrome (worker verified via navigator.userAgent 2026-09-07; 70bf3142-… is Edge)
    chrome_name: winbox-chrome
    os: windows
    remote_control: true   # session shows in the CEO Claude app
    ssh: winbox
    agents_root: 'C:\Users\UsEr\mooniex'
    worktrees: 'C:\Users\UsEr\mooniex\worktrees'
    provides: [chrome, blender, win_gui]
    # CEO 2026-09-09: "เปิดไม่เกิน 2 Worker ก็พอแล้ว" — two on winbox is inside
    # that rule; the second is a read-only tab (tab_registry keeps them apart).
    max_workers: 2
    max_browser_operators: 2
    # Measured 2026-09-20, RECONCILED 2026-09-22 (CTO REVIEW-ITER2.md, doc
    # commit 0d8490f9): claude.exe (.local\bin, working), codex.cmd
    # (%APPDATA%\npm, codex-cli 0.153.4, signed in), agy.exe
    # (%LOCALAPPDATA%\agy\bin, Antigravity 1.2.6) -- ALL THREE confirmed
    # present and signed in on winbox, `agy models` returns all 14 models
    # when run in session 1. docs/ops/agent-runners.md §1's old "Mac only"
    # line for agy was stale (fixed in §6a); the credential lives in the
    # session-1 logon keyring, same session-0 boundary as codex's sandbox
    # pipe -- over plain ssh agy still says "Please sign in", which is
    # expected, not a sign of absence.
    runners: [claude, codex, agy]

  contabo:
    os: linux
    remote_control: true   # session shows in the CEO Claude app
    ssh: mooniex-vps
    agents_root: /opt/mooniex-agents
    worktrees: /opt/mooniex-agents/worktrees
    provides: [always_on, api]
    max_workers: 3
    max_browser_operators: 0
    # No launcher wired for Contabo yet (tools.delegate._spawn_remote raises
    # NotImplementedError for any non-windows host) -- claude listed only so
    # host_runners()/_validate_runner() have a sane default; not reachable
    # via delegate_task until a Contabo launcher exists (Phase 2).
    runners: [claude]
