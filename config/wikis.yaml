# Wiki root registry (ADR 0013 — wiki scope boundary).
#
# Namespace -> absolute path on disk. tools/wiki.py resolves every
# wiki_read/wiki_write/wiki_list/wiki_search call against this file.
#
# `default` names the namespace used when a path carries no "ns:" prefix
# (backwards compatibility for every pre-multiroot caller). Its `path` can
# still be overridden at runtime by the WIKI_ROOT env var — see the
# precedence note in tools/wiki.py's module docstring.
#
# `org` (Agents-Wikis) is live — its own git repo, checked out on the Mac at
# the path below and on Contabo at /opt/agents-wikis (cto-claude.sh /
# cxo-claude.sh export WIKI_ROOT_ORG there). `mooniex` is NOT checked out on
# Contabo, so an unprefixed path fails on that box — prefix `org:` there.
# Any root that is genuinely missing is skipped by wiki_list/wiki_search and
# raises a named WikiError from wiki_read/wiki_write.
default: mooniex
wikis:
  - ns: org
    name: Agents Rules   # repo PASAKON/Agents-Rules (renamed 2026-09-22, ADR 0028); folder rename comes at HQ step 4
    path: /Users/gob/Projects/Agents-Wikis
  - ns: mooniex
    name: Agents Wikis   # repo PASAKON/Agents-Wikis (was MoonieX-Wikis; local folder still LLMs/ until HQ step 4)
    path: /Users/gob/Projects/LLMs
  - ns: lungnote
    name: LungNote Wikis
    path: /Users/gob/MoonieXHQ/Projects/LungNote/Wikis
