# Who owns which paths in Agents-Core (lib/path_owners.py, tools/pr_owner_check.py, check_collisions).
#
# CEO 2026-10-14: each Project Head merges its own project's paths; CTO Main steps in only on a conflict.
# A PH runs `tools/pr_owner_check.py <PR#> --project <Name>` before merging: a path another project owns
# is a conflict (exit 1 → write CTO Main kind blocker); a `shared` path belongs to no PH (printed, exit 0,
# tell CTO Main). A path matching no glob is unowned and free for anyone.
#
# Keys are the Project Head project names (the strings in state/locks/project_head-*.project) plus the
# reserved key `shared`. Values are fnmatch globs over repo-relative paths; `*` also crosses `/`, so
# `dir/**` and `dir/*` both mean "everything under dir". The LONGEST matching glob wins, so a narrow glob
# under a broad one carves an exception out of it (e.g. a project skill inside `.claude/skills/`).
# Seeded 2026-10-15 from docs/plans/*-STATUS.md and the 80 most recent merged PRs; an entry for a file
# that does not exist yet says so. A project not listed here (CooGate, ...) owns nothing and so is
# "foreign" on every owned path. Add a glob when a project grows a new area; one glob under one key.

