    # id_ed25519_cookierun, so the box keeps least-privilege access per repo.
    # `_ssh_remote_url()` passes a git@ URL through untouched, which is what makes
    # the alias survive to the clone command.
    remote: git@github-cookierun:PASAKON/MoonieX-CookieRun.git
    default_branch: main
