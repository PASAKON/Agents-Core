# Project registry. Add new projects here.
# `path` is absolute. CTO uses this to look up worktree base.

# Note: projects are NOT split by frontend/backend. Each project allows all
# worker roles; CTO picks the right role per task.

# Optional auto_deploy block (per project):
#
#   auto_deploy:
#     enabled: false                # default false; explicit opt-in required
#     requires_ceo_ack: true        # if true, merge_task records "awaiting_ceo_ack"
#                                   # and does NOT run the command; the deploy_task
#                                   # MCP tool (separate feature) fires it later
#     command: |
#       ssh host 'cd /path && git fetch origin --quiet \
#         && git reset --hard origin/main && pm2 reload app --update-env'
#     timeout_seconds: 60           # subprocess timeout; default 60
#
# Behaviour:
#   - No auto_deploy block → deploy field in merge result = {deployed: false, reason: "no auto_deploy config"}
#   - enabled: false → same as no block (no-op)
#   - enabled: true, requires_ceo_ack: true → deploy field = {deployed: false, reason: "awaiting_ceo_ack", command: ...}
#   - enabled: true, requires_ceo_ack: false → command runs; stdout/stderr tails + rc captured
#   - Command failure never rolls back the merge; merge result is always preserved

_default_workers: &default_workers
  - developer
  - tester
  - web_designer
  - devops_engineer
  - security_engineer
  - data_analyst
  - prompt_engineer

projects:
  - key: mooniex-claudeflow
    name: mooniex-claudeflow
    path: /Users/gob/Projects/mooniex-claudeflow
    remote: git@github.com:PASAKON/mooniex-claudeflow.git
    default_branch: main
    stack: [node, typescript]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    # gate_tests: true → CTO runs test_command in worktree before merge
    test_command: npm test --silent
    gate_tests: false
    # CEO preference 2026-05-19: iTerm only — no auto ttyd browser
    # (default backend = iterm, no spawn_backend / web_ui keys)
    # Auto-deploy: disabled by default. CEO sets enabled: true to activate.
    auto_deploy:
      enabled: false
      requires_ceo_ack: true
      command: |
        ssh mooniex-vps 'cd /root/projects/mooniex-claudeflow \
          && git fetch origin --quiet \
          && git reset --hard origin/main \
          && pm2 reload claudeflow --update-env'
      timeout_seconds: 60
    wiki_refs:
      - playbooks/backend.md

  - key: mooniex-webapp
    name: mooniex-webapp
    path: /Users/gob/Projects/mooniex-webapp
    remote: git@github.com:PASAKON/mooniex-webapp.git
    default_branch: main
    stack: [next.js, typescript, supabase]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    wiki_refs:
      - playbooks/frontend.md
      - playbooks/backend.md

  - key: mooniex-claudesign
    name: mooniex-claudesign (Web Designer)
    path: /Users/gob/Projects/mooniex-claudesign
    # fork ของ nexu-io/open-design — upstream remote = readonly sync source
    # mooniex remote (push target) = PASAKON/mooniex-claudesign
    remote: https://github.com/PASAKON/mooniex-claudesign.git
    upstream: https://github.com/nexu-io/open-design.git
    default_branch: mooniex-main
    stack: [next.js, typescript, electron, pnpm]
    agents_allowed: [web_designer, developer, tester]
    auto_push: false
    review_required: true
    # tmux+ttyd backend — Web UI terminal สามารถ attach ผ่าน browser
    spawn_backend: tmux
    web_ui: optional         # true → auto-open browser พร้อม iTerm
    # content_zone — paths Web Designer agent แก้ได้.
    # นอก zone นี้ = upstream code, ห้ามแตะ (pre-commit hook enforce)
    content_zone:
      - design-systems/**
      - design-templates/**
      - skills/**
      - craft/**
      - .agents/**
      - README.mooniex.md
    wiki_refs:
      - playbooks/web-designer.md
      - projects/mooniex-claudesign.md

  - key: LLMs
    name: LLMs (Wiki)
    path: /Users/gob/Projects/LLMs
    remote: git@github.com:PASAKON/mooniex-llms-wiki.git
    default_branch: main
    stack: [markdown]
    # C-level only — wiki integrity protected
    agents_allowed: [cto]
    auto_push: true
    review_required: false
    wiki_refs: []
