# Project registry. Add new projects here.
# `path` is absolute. CTO uses this to look up worktree base.

# Note: projects are NOT split by frontend/backend. Each project allows all
# worker roles; CTO picks the right role per task.

# Optional auto_deploy block (per project):
#
#   auto_deploy:
#     enabled: false                # default false; explicit opt-in required
#     requires_ceo_ack: true        # if true, merge_task records "awaiting_ceo_ack"
#                                   # and does NOT run the command; the deploy_task
#                                   # MCP tool (separate feature) fires it later
#     command: |
#       ssh host 'cd /path && git fetch origin --quiet \
#         && git reset --hard origin/main && pm2 reload app --update-env'
#     timeout_seconds: 60           # subprocess timeout; default 60
#
# Behaviour:
#   - No auto_deploy block → deploy field in merge result = {deployed: false, reason: "no auto_deploy config"}
#   - enabled: false → same as no block (no-op)
#   - enabled: true, requires_ceo_ack: true → deploy field = {deployed: false, reason: "awaiting_ceo_ack", command: ...}
#   - enabled: true, requires_ceo_ack: false → command runs; stdout/stderr tails + rc captured
#   - Command failure never rolls back the merge; merge result is always preserved

_default_workers: &default_workers
  - developer
  - tester
  - web_designer
  - devops_engineer
  - security_engineer
  - data_analyst
  - prompt_engineer
  - ads_manager
  - content_strategist

projects:
  - key: mooniex-claudeflow
    name: mooniex-claudeflow
    path: /Users/gob/Projects/mooniex-claudeflow
    remote: git@github.com:PASAKON/mooniex-claudeflow.git
    default_branch: main
    stack: [node, typescript]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    # gate_tests: true → CTO runs test_command in worktree before merge
    test_command: npm test --silent
    gate_tests: false
    # CEO preference 2026-05-19: iTerm only — no auto ttyd browser
    # (default backend = iterm, no spawn_backend / web_ui keys)
    # Auto-deploy: disabled by default. CEO sets enabled: true to activate.
    auto_deploy:
      enabled: false
      requires_ceo_ack: true
      # Webhook server runs in Docker (docker-compose.webhook.yml), NOT pm2.
      # Corrected 2026-06-01 after the P1 LINE-fix deploy: pm2 reload never
      # touched the webhook container. Rebuild the image so new code lands.
      command: |
        ssh mooniex-vps 'cd /root/projects/mooniex-claudeflow \
          && git fetch origin --quiet \
          && git reset --hard origin/main \
          && docker compose -f docker-compose.webhook.yml up -d --build'
      # Docker image rebuild can exceed 60s; give it headroom.
      timeout_seconds: 300
    wiki_refs:
      - playbooks/backend.md

  - key: mooniex-webapp
    name: mooniex-webapp
    path: /Users/gob/Projects/mooniex-webapp
    remote: git@github.com:PASAKON/mooniex-webapp.git
    # Canonical trunk is bootstrap/landing-mvp (IRON-RULES §"shared branch";
    # GitHub origin/HEAD points here). main is a divergent line — do not target.
    default_branch: bootstrap/landing-mvp
    stack: [next.js, typescript, supabase]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    # CEO preference 2026-05-19: iTerm only — no auto ttyd browser
    wiki_refs:
      - playbooks/frontend.md
      - playbooks/backend.md

  - key: mooniex-claudesign
    name: mooniex-claudesign (Web Designer)
    path: /Users/gob/Projects/mooniex-claudesign
    # fork ของ nexu-io/open-design — upstream remote = readonly sync source
    # mooniex remote (push target) = PASAKON/mooniex-claudesign
    remote: https://github.com/PASAKON/mooniex-claudesign.git
    upstream: https://github.com/nexu-io/open-design.git
    default_branch: mooniex-main
    stack: [next.js, typescript, electron, pnpm]
    agents_allowed: [web_designer, developer, tester]
    auto_push: false
    review_required: true
    # iTerm backend — web_designer spawns interactive claude TUI in tab
    # (was tmux+ttyd until 2026-05-23, switched so CTO can use send_to_dev
    # the same way as other DEV roles; claudesign Web UI stays optional)
    # content_zone — paths Web Designer agent แก้ได้.
    # นอก zone นี้ = upstream code, ห้ามแตะ (pre-commit hook enforce)
    content_zone:
      - design-systems/**
      - design-templates/**
      - skills/**
      - craft/**
      - .agents/**
      - README.mooniex.md
    wiki_refs:
      - playbooks/web-designer.md
      - projects/mooniex-claudesign.md

  - key: lungnote-webapp
    name: LungNote Webapp
    path: "/Users/gob/LungNote Projects/webapp"
    remote: https://github.com/PASAKON/LungNote-webapp.git
    default_branch: main
    stack: [next.js, typescript, supabase]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    wiki_refs:
      - playbooks/frontend.md
      - playbooks/backend.md

  - key: LLMs
    name: LLMs (Wiki)
    path: /Users/gob/Projects/LLMs
    remote: git@github.com:PASAKON/mooniex-llms-wiki.git
    default_branch: main
    stack: [markdown]
    # C-level only — wiki integrity protected
    agents_allowed: [cto]
    auto_push: true
    review_required: false
    wiki_refs: []

  - key: mooniex-agents
    name: Mooniex Agents (meta-repo)
    path: /Users/gob/Projects/Agents
    remote: https://github.com/PASAKON/mooniex-agents.git
    default_branch: main
    stack: [python]
    agents_allowed: *default_workers
    # Self-modifying repo — DEV works in worktree, never pushes direct;
    # CTO reviews before merge.
    auto_push: false
    review_required: true
    wiki_refs:
      - playbooks/backend.md

  - key: warpclip-webapp
    name: WarpClip Webapp
    path: /Users/gob/WarpClip Projects/webapp
    remote: https://github.com/PASAKON/WarpClip-webapp.git
    default_branch: main
    stack: [next.js, typescript, tailwind]
    agents_allowed: *default_workers
    auto_push: false
    review_required: true
    wiki_refs:
      - playbooks/frontend.md

  - key: mooniex-video-engine
    name: Mooniex Video Engine
    path: /Users/gob/Projects/mooniex-video-engine
    # Local-only POC (2026-06-21): data-driven 3D video via Godot 4.7 + ffmpeg.
    # No GitHub repo created yet — remote is the intended URL but auto_push is
    # false, so merge_task merges to local main only (push once POC approved).
    remote: git@github.com:PASAKON/mooniex-video-engine.git
    default_branch: main
    stack: [godot, gdscript]
    agents_allowed: *default_workers
    auto_push: false
    review_required: true
    wiki_refs: []

  - key: mooniex-scriptable
    name: Mooniex Scriptable (iOS widgets)
    path: /Users/gob/Projects/mooniex-scriptable
    remote: https://github.com/PASAKON/mooniex-scriptable.git
    default_branch: main
    stack: [scriptable, javascript, python]
    agents_allowed: *default_workers
    # CEO's Scriptable (iOS) widgets + their Mac/VPS feeders. Widget SOURCE lives
    # here; the DEPLOYED copy is the iCloud Scriptable folder (repo CLAUDE.md).
    # Code migrates from mooniex-agents in a reviewed Phase 2 (docs/MIGRATION.md).
    # DB: none — RESERVED table prefix `scriptable_` if persistence is ever needed.
    auto_push: false
    review_required: true
    wiki_refs:
      - projects/mooniex-scriptable.md
