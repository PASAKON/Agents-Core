# Project registry. Add new projects here.
# `path` is absolute. CTO uses this to look up worktree base.

# Note: projects are NOT split by frontend/backend. Each project allows all
# worker roles; CTO picks the right role per task.

# Optional auto_deploy block (per project):
#
#   auto_deploy:
#     enabled: false                # default false; explicit opt-in required
#     requires_ceo_ack: true        # if true, merge_task records "awaiting_ceo_ack"
#                                   # and does NOT run the command; the deploy_task
#                                   # MCP tool (separate feature) fires it later
#     command: |
#       ssh host 'cd /path && git fetch origin --quiet \
#         && git reset --hard origin/main && pm2 reload app --update-env'
#     timeout_seconds: 60           # subprocess timeout; default 60
#
# Behaviour:
#   - No auto_deploy block → deploy field in merge result = {deployed: false, reason: "no auto_deploy config"}
#   - enabled: false → same as no block (no-op)
#   - enabled: true, requires_ceo_ack: true → deploy field = {deployed: false, reason: "awaiting_ceo_ack", command: ...}
#   - enabled: true, requires_ceo_ack: false → command runs; stdout/stderr tails + rc captured
#   - Command failure never rolls back the merge; merge result is always preserved

_default_workers: &default_workers
  - developer
  - tester
  - web_designer
  - browser_operator
  - devops_engineer
  - security_engineer
  - data_analyst
  - prompt_engineer
  - ads_manager
  - content_strategist
  - video_editor
  - script_writer

projects:
  - key: mooniex-claudeflow
    name: mooniex-claudeflow
    path: /Users/gob/MoonieXHQ/Projects/MoonieX/ClaudeFlow
    remote: git@github.com:PASAKON/MoonieX-ClaudeFlow.git
    default_branch: main
    stack: [node, typescript]
    agents_allowed: *default_workers
    auto_push: true
    review_required: true
    # gate_tests: true → CTO runs test_command in worktree before merge.
    # Enabled 2026-07-19 after verifying: 709/710 pass (1 skipped), 8.4s.
    test_command: npm test --silent
    gate_tests: true
    # Per-host checkout paths (Phase 1, docs/design/multi-host-workers.md).
    # mac stays implicit via top-level `path:` above — listed here too so a
    # host lookup is uniform. contabo is a real clone (CLAUDE.md's Contabo
    # availability table); winbox is not cloned yet, so it is left out
    # (project_path_for_host raises rather than guessing).
    paths:
      mac: /Users/gob/MoonieXHQ/Projects/MoonieX/ClaudeFlow
      contabo: /root/projects/mooniex-claudeflow
    # task-2f04a8ca (CEO 2026-08-14): tmux-backed so send_to_dev's mailbox+
    # wake can actually reach a spawned DEV (a wake only lands via
    # `task["tmux_session"]`; iterm-backend DEVs never set it, so the
    # watchdog's 10-min ping silently no-ops). iTerm tab still attaches to
    # the tmux session (`tmux attach`) — visibly, per IRON-RULES §29.
    # CEO preference 2026-05-19 (no auto ttyd browser) is untouched: web_ui
    # is unset/off here, so no browser opens; tmux only changes the pty host.
    spawn_backend: tmux
    # Auto-deploy: disabled by default. CEO sets enabled: true to activate.
    auto_deploy:
      enabled: false
      requires_ceo_ack: true
      # Webhook server runs in Docker (docker-compose.webhook.yml), NOT pm2.
      # Corrected 2026-06-01 after the P1 LINE-fix deploy: pm2 reload never
      # touched the webhook container. Rebuild the image so new code lands.
      command: |
        ssh mooniex-vps 'cd /root/projects/mooniex-claudeflow \
          && git fetch origin --quiet \
          && git reset --hard origin/main \
          && docker compose -f docker-compose.webhook.yml up -d --build'
      # Docker image rebuild can exceed 60s; give it headroom.
      timeout_seconds: 300
    wiki_refs:
      - playbooks/backend.md

