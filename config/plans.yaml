# Subscriptions. Append a new entry when a plan changes; never delete old ones (history).
# Router pressure rule (IRON §59 rule 7 / Q-20261013-1745-f56c): outside runners first.
pressure_rule: true
providers:
  # 2026-10-14: the CEO gave $200 (session banners say Claude Max). When the $200 plan
  # started is not recorded, so "from" is the day he said it, not the start date.
  anthropic: {runner: claude, plans: [{usd: 200, from: "2026-08-29"}, {usd: 20, from: "2026-09-29T10:00:00Z"}, {usd: 200, from: "2026-10-14"}]}
  # 2026-10-14 CEO (via SomPong): Google AI Ultra, $100/mo, kept long term (Colab, Flow 10,000 credits,
  # Argon via agy, Flow Music). Claude Max $200, ChatGPT $20.
  google:    {runner: agy,    plans: [{usd: 100, from: "2026-09-01"}]}
  openai:    {runner: codex,  plans: [{usd: 20,  from: "2026-09-01"}]}
# Monthly target once the org settles (CEO 2026-10-14, via SomPong): $320 now -> $140. tools/tool_value.py
# reports the gap weekly. The router does not read this block.
targets:
  anthropic: {usd: 20,  from: "2026-10-14"}
  google:    {usd: 100, from: "2026-10-14"}
  openai:    {usd: 20,  from: "2026-10-14"}
# Free grants / surprise resets: {provider, from, to, note}. While active the provider is treated as weekly=1.0.
bonuses:
  - {provider: openai, from: "2026-10-15", to: "2026-11-07T04:28:00+07:00", note: "Codex: 3 full resets (exp 23 Oct 02:22, 30 Oct 00:34, 7 Nov 04:28 TH), auto reset below 10% (CEO 15 Oct)"}
buckets:              # one limit that runs out; a candidate "runner:model" belongs to the first bucket whose match prefix it starts with
  claude:     {provider: anthropic, match: ["claude:"]}
  codex:      {provider: openai,    match: ["codex:"]}
  agy-gemini: {provider: google,    match: ["agy:gemini-"]}
  agy-claude: {provider: google,    match: ["agy:claude-", "agy:gpt-"]}
# Runners that can run arbitrary shell commands headless.
shell_runners: [claude, codex]
# Candidate list per job class, in the CEO's order. "runner:model[:effort]".
roles:
  # 2026-10-14: agy dropped claude-sonnet-4-6 ("not recognized", exit 1), so it is now claude-sonnet-5-5-high.
  # The Argon trial is done (9c078b65); CEO ruled 15 Oct that Argon beats Sonnet and goes first.
  dev_general:    ["agy:gemini-4-argon-high", "agy:gemini-3.8-flash-high", "agy:claude-sonnet-5-5-high", "codex:", "claude:claude-sonnet-5-5"]
  # Jobs that must run shell commands (shell_runners only). "codex:" with an empty model = the CLI default;
  # a model label here would reach the launcher as `-m <label>` (H3, 8db9213f).
  dev_shell:      ["codex:", "claude:claude-sonnet-5-5"]
  c_level:        ["claude:claude-opus-5-5:xhigh"]
  c_level_openai: ["codex:sol:xhigh"]
  complex:        ["claude:claude-fable-5-1", "codex:astra:xhigh"]
  # GH #188: browser_operator tasks whose brief uses tools/agy_browse.py and names a
  # Browser Home CDP URL (tools/route.class_for). Not a role_classes entry on purpose.
  browser_agy:    ["agy:gemini-3.8-flash-high"]
  # Docs, copy, scripts and translation (edit-only: no shell). Maps content_strategist and script_writer.
  doc_text:       ["agy:gemini-4-argon-high", "agy:gemini-3.8-flash-high", "codex:", "claude:claude-sonnet-5-5"]
  # SomPong's researcher workers (CEO card Q-20261013-1948-4a33): web search + read-only reading inside
  # runners/coo_worker.py's box, report only. codex first (`--search`). ArgonEval 15 Oct (R1, R2): Argon
  # invented quotes and a "verbatim" code block on 2 of 2 jobs; agy Sonnet passed both with every quote
  # checked, at $0 Claude. Argon is dropped here; agy Sonnet second, Claude Code Sonnet last.
  research:       ["codex:", "agy:claude-sonnet-5-5-high", "claude:claude-sonnet-5-5"]
  # Tests written edits-only, then run by the reviewer (ArgonEval T1, T2: 2/2 first pass, every seeded
  # revert red). The reviewer MUST run them: Argon cannot (B2 shipped a test with a bad import).
  tests_edit:     ["agy:gemini-4-argon-high", "codex:", "claude:claude-sonnet-5-5"]
  # Numbers from a file or an export the brief hands over (ArgonEval A1, A2: 2/2 first pass, every
  # number re-derived by the reviewer). The reviewer re-derives the headline numbers.
  analysis:       ["agy:gemini-4-argon-high", "codex:", "claude:claude-sonnet-5-5"]
# Worker role (tasks.role) -> router class above. A role not listed stays on claude, no routing.
# Browser, video, design and security roles need Claude-only tools: never list them here.
# (A browser_operator brief that uses tools/agy_browse.py routes to browser_agy instead.)
role_classes:
  developer: dev_general
  # Shell-requiring roles routed to dev_shell class.
  # devops_engineer is NOT listed: it is an Opus worker (policies/agents.yaml, CEO 2026-09-23) and
  # dev_shell would move it to codex/Sonnet. The old key `devops` matched no role (removed
  # 2026-10-04); routing devops_engineer here waits for the CEO.
  # ArgonEval 15 Oct: a tester's job is writing tests; the reviewer runs them. dev_shell stays for
  # briefs that need a shell inside the run (tools/forecast.needs_shell, read by tools/route.plan, drops non-shell runners then).
  tester:    tests_edit
  data_analyst: analysis
  # security_engineer and devops_engineer stay on Claude Opus (ArgonEval: security 1 of 3 first pass,
  # missed ~40 callers on the big one; devops 1 of 2, a global logger flip). Argon + review only for
  # a scoped list of LOW fixes, picked by hand.
  researcher: research   # SomPong's research workers (Q-20261013-1948-4a33), run by runners/coo_worker.py
  content_strategist: doc_text  # copy, voice, positioning text; its skills are writing guides, not tools
  script_writer: doc_text       # scripts are text; a BL brief that also asks for footage capture or a browser is caught by needs_claude_tool and falls to Claude
  # NOT prompt_engineer: its job includes MCP servers, tool schemas and running evals (shell + code).
# size-S jobs in these classes put this candidate first (tools/route.plan). CEO 15 Oct: Flash 3.8 is the fast,
# cheap one, Argon the smart one; Argon leads M and L. doc_text keeps Argon first at every size.
small_first:
  dev_general: "agy:gemini-3.8-flash-high"
router:
  # CEO 16 Oct (CTO Main chat): "ใช้ Argon ให้หมดก่อน หลังจากนั้นก็ ChatGPT และสุดท้ายคือ Claude". The roles lists
  # are tried in order; the router moves on only when a candidate's quota is spent (exhausted, or the job would
  # take it under its reserve). "fullest" = the old rule: most weekly quota left first, list order on ties.
  # "budget" keeps CEO order but moves buckets over today's usage target behind under/unknown buckets.
  order: budget         # CEO 22 Oct (UsageBudget "1-5 ใช่เลย"): CEO order, but a bucket over today's target goes behind the rest
  tie_points: 5          # weekly remaining within 5 percentage points = tie, go to daily
  min_samples: 5         # skill score needs >= 5 reviewed tasks, else treated as unknown
quota_sources:           # where each reader looks; ssh host "" = local
  claude: {ssh: mooniex-vps, path: /opt/claude-usage-monitor/usage.json}
  codex:  {ssh: mooniex-vps, sessions_glob: "/root/.codex/sessions/*/*/*/rollout-*.jsonl"}
  agy:    {ssh: "", cmd: ["~/.local/bin/agy", "-p", "/usage", "--output-format", "json"]}
