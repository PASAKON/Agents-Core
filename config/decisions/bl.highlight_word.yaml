# Decision site: WHICH content word/number/brand in the line should the
# highlight_sweep or on-screen caption land on? (task-5cfe20b1). Positional
# slot site — code computes the candidates upstream (jev_edit.py's
# content_words(): brand mentions via brand-display.yaml, numbers/
# percentages, and Latin-script tokens found in the spoken line), labelled
# A-F in order of appearance; Jev only picks among them. Only asked when
# the line has at least one such candidate.
site: bl.highlight_word
question: >-
  Given the numbered candidate words/numbers/brands below, found in this
  line's spoken text, which one should the on-screen highlight (yellow
  sweep or kinetic emphasis) land on?
options:
  - id: A
    meaning: "The candidate labelled 'A' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: B
    meaning: "The candidate labelled 'B' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: C
    meaning: "The candidate labelled 'C' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: D
    meaning: "The candidate labelled 'D' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: E
    meaning: "The candidate labelled 'E' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: F
    meaning: "The candidate labelled 'F' in state.candidates — pick it if it is the word/number/brand this line is emphasising."
  - id: other
    meaning: "None of the listed candidates is the right word (including nothing worth highlighting on this line)."
max_state_chars: 1000
provider_policy: rules-then-llm
rules: []
counterfactual:
  images: 0
  big_model_tokens_out: 15
