# Decision site: which focus device (if any) draws the eye to the evidence
# plate on a "show" line? (task-5cfe20b1). Measured devices:
# .claude/skills/blackliquidity-cut/SKILL.md §6d "Focus devices on the
# evidence plate — measured". Only asked by jev_edit.py when bl.beat
# answered "show" for this line. State is the line's shot/screen fields
# (computed/structured), optionally the raw spoken text under
# --state-lang=th.
#
# Criteria examples are held-out lines from prototypes/bl55-script/
# SCRIPT-v2.tsv, not from EP57 (bl57-script/) or the reference transcript
# (bl-ref-census/) — CTO review 2026-09-23, see bl.beat.yaml's header note.
site: bl.focus_device
question: >-
  For this "show" line, which focus device (if any) should draw the
  viewer's eye to the one thing on the evidence plate the line is about?
options:
  - id: spotlight
    meaning: >-
      The page dims to grey except a bright circle around ONE specific
      value being named. Example: the line calls out a single number —
      "คะแนนความน่าเชื่อถือ ไม่ถึงสองเต็มสิบ" — naming exactly one figure on
      an otherwise busy page.
  - id: highlight_sweep
    meaning: >-
      A left-to-right yellow bar sweeps across a table row or a chip as the
      line names it. Example: the line reads off one entry among several
      similar ones — "มีผู้ใช้ร้องเรียนว่าโดนขโมยกำไรไปเกือบห้าหมื่นดอล"
      naming one row in a list of complaint entries.
  - id: zoom_only
    meaning: >-
      A continuous pan/push on the plate with no dimming and no sweep —
      used when the line is walking through a page broadly rather than
      naming one exact value. Example: "บริษัทตั้งอยู่ที่เซเชลส์
      เกาะเล็กกลางมหาสมุทรอินเดีย" while the camera pushes into the
      company's profile page generally.
  - id: none
    meaning: >-
      The plate is shown plain, nothing further needed to draw the eye —
      the evidence is already obvious at a glance (e.g. a single large
      score already fills the frame).
  - id: other
    meaning: None of the above fits.
max_state_chars: 1000
provider_policy: rules-then-llm
rules: []
counterfactual:
  images: 0
  big_model_tokens_out: 25
