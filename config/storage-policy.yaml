# Storage policy — where every byte an agent writes belongs, and when it leaves.
# ADR 0030 (org: decisions/0030-agent-storage-every-byte-has-a-tier-and-an-end.md).
#
# v0, 2026-09-23. Written the morning the Mac hit 0 bytes free (04:05) and every
# tool died. Source of truth for: the free-space gauge in delegate, the storage
# scan, the media guard, and the task close gate. Change it here, nowhere else.
#
# Paths are globs; "~" is the running user's home. A path matching no tier is
# UNCLASSIFIED — the scan reports it; nothing acts on it.
version: 0

# Free space on "/" in GB. Each band keeps every action of the bands above it.
gauge:
  green:  20   # >= 20 GB: normal
  yellow: 10   # < 20: notify the CEO once a day, list COLD candidates
  orange: 5    # < 10: delete REBUILD automatically; no new download/video task spawns
  red:    0    # < 5:  delegate refuses every spawn in the scope[disk_floor] below

# Per-host spawn floor in GB free, on the drive that holds that host's
# worktrees; overrides gauge.orange for that host only (delegate + the
# watchdog's disk-queue drain). winbox: its own documented floor
# (ALL_Rules_DiskHygiene references/winbox.md, "critical below that") — the
# box a bot fills 2-4 GB a day, which the single 5 GB band never protected.
host_floor_gb:
  winbox: 30

# Per-feature scope (CEO 2026-09-23): which owner_cto each feature applies
# to. "all" = every task of every session, including owner_cto=None; a
# list = membership only. Missing key or missing feature = applies to
# nobody (fail closed). Replaced a single org-wide-floor-was-too-blunt
# starting scope (18 other CTO sessions owned 58 in-flight tasks the hour
# this policy was written — an org-wide floor would have refused all of
# them) with this per-feature map, task C7, same day. The CEO widened all
# six (A-F) to "all" the same day.
scope:
  disk_floor:      all              # A: no new worker under gauge.orange free
  sparse_worktree: all              # B: worker checkouts without large tracked media (video_editor still full)
  reclaim:         all              # C: under 10 GB, delete REBUILD dirs inside task worktrees
  work_dir:        all              # D: Work/<task>/ + WORK_DIR + close gate + watcher
  space_check:     all              # E: estimate-based check before a paid generation / download
  media_guard:     all              # F: every commit (CEO 2026-09-23: "media ไม่ควรเอาเข้าอยู่แล้ว"); one-off bypass: git commit --no-verify

# E, as the CEO ruled 2026-09-23: not a fixed 10 GB floor. Before creating,
# the project's worker/CTO estimates the output size; proceed only if at least
# `min_free_after_gb` would remain afterwards ("คำนวณแล้วว่าสร้างแล้วจะเหลือพื้นที่
# อย่างน้อย 3-5 GB ก็ทำได้เลย ... ให้ worker และ CTO โปรเจคนั้นๆ เป็นคนประเมิน").
space_check:
  min_free_after_gb: 5              # CEO range 3-5 GB; 5 = the delegate floor, so the two never disagree (was 4 then 3 temporarily for taachang ACT1/ACT2 on 2026-09-25; restored when the Trash was emptied, 75 GB free)
  estimate_sources: [--expect-gb flag, WORK_EXPECT_GB env, per-project estimate below]
  default_estimate_gb: 1            # used only when nobody estimated; the runner logs that it guessed
  estimates_gb: {}                  # filled by each project's CTO, e.g. {banchi-flow: 0.05}

tiers:
  # In use right now. Stays on the Mac.
  HOT:
    - "~/MoonieXHQ/Projects/**"
    - "~/MoonieXHQ/Agents/**"
    - "~/Projects/Agents/**"            # Agents-Core until HQ step 4b moves it
    - "/opt/MoonieXHQ/Projects/**"      # Contabo's HQ (/root/MoonieXHQ links here)
    - "/opt/MoonieXHQ/Agents/**"
    - "~/.claude/projects/*/*.jsonl"    # transcripts < 7 days (older = COLD, see below)
  # Rebuilds itself from a named command. Delete without asking (ALL_Rules_DiskHygiene Green list) —
  # on every machine, Contabo included (CEO 2026-09-28 ruling 4). Docker build cache is Green too,
  # but by command (`docker builder prune`), never by path: images and volumes are not.
  REBUILD:
    - {glob: "~/Library/Caches/Google/Chrome/*/Cache",      rebuild: "Chrome refills it"}
    - {glob: "**/Code Cache",                               rebuild: "the browser / Electron app refills it"}
    - {glob: "**/GPUCache",                                 rebuild: "the browser / Electron app refills it"}
    - {glob: "~/Library/Caches/pip",                        rebuild: "pip install"}
    - {glob: "~/.cache/pip",                                rebuild: "pip install"}            # Linux (Contabo)
    - {glob: "~/.npm/_cacache",                             rebuild: "npm install"}
    - {glob: "~/.npm/_npx",                                 rebuild: "npx re-downloads on demand"}
    - {glob: "/var/cache/apt/archives",                     rebuild: "apt-get clean; apt re-downloads"}  # Contabo
    - {glob: "~/Library/Caches/Homebrew",                   rebuild: "brew fetch"}
    - {glob: "~/.cache/huggingface",                        rebuild: "model re-download"}
    - {glob: "~/.cache/torch",                              rebuild: "model re-download"}
    - {glob: "**/__pycache__",                              rebuild: "python re-imports"}
    - {glob: "**/.pytest_cache",                            rebuild: "pytest"}
    - {glob: "**/node_modules",  rebuild: "npm ci",            dormancy: true}
    - {glob: "**/.venv",         rebuild: "uv sync / pip -r", dormancy: true}
    - {glob: "**/.next",         rebuild: "next build",       dormancy: true}
    - {glob: "/private/tmp/runner-review/**", rebuild: "git checkout of docs/"}
  # Not regenerable, not in use. Tar + manifest → Drive BACKUP/ (CXO_Rules_GDrive_Filing), md5 verified, then deleted.
  COLD:
    - {glob: "~/.claude/projects/*/*.jsonl", older_than_days: 7,
       dest: "BACKUP/MoonieX HQ/Claude-Transcripts/<machine>/<slug>/",
       tool: "prune_transcripts.py --archive (Mac) / tools/drive_leg.py transcripts (Contabo)"}
    - {glob: "<work_root>/<task-id>/in/**", when: "task closed",
       dest: "proposed — CEO picks the Drive folder (CXO_Rules_GDrive_Filing)"}
  # The CEO's own. No agent deletes, moves or archives these. Ever.
  NEVER:
    - "~/Pictures/**"
    - "~/Library/Application Support/CloudDocs/**"   # an orphaned store too: no standing wipe step, ask him each time (CEO 2026-09-28 ruling 5)
    - "~/Library/Mobile Documents/**"
    - "~/Desktop/**"
    - "~/Downloads/**"
    - "~/Movies/**"
    - "~/.claude/projects/*/memory/**"
    - "/private/tmp/claude-501/**"          # every session's scratch; a session cleans only its own, by hand
    - "/tmp/claude-0/**"                    # the same on Contabo (sessions run as root)
    # Login state — never Green on any machine (CEO 2026-09-28 ruling 4): no agent deletes it on its
    # own; only when truly necessary, and only after asking him. Profile ROOTS are exact paths (no
    # /**), so the HTTP caches inside a profile (Code Cache, GPUCache above) still class REBUILD.
    - "**/Cookies"
    - "**/Login Data"
    - "**/Local State"                      # Windows: holds the key that decrypts Cookies
    - "**/Local Storage/**"
    - "**/LocalStorage"
    - "**/IndexedDB/**"
    - "**/Session Storage/**"
    - "**/SessionStorage"
    - "~/Library/Application Support/Google/Chrome"                          # Mac: the CEO's Chrome, every profile
    - "~/.*-automation/chrome-profile"                                         # CDP profiles (Flow, Higgsfield, BL TikTok, ChatGPT)
    - "~/AppData/Local/Google/Chrome/User Data"                               # winbox
    - "/opt/MoonieXHQ/Projects/MoonieX/Console/data/browser-homes/*/profile"  # Contabo Browser Home
    - "**/.credentials.json"                # Claude Code logins (~/.claude, /opt/claude-usage-monitor)
    - "~/.config/gh/hosts.yml"
    - "**/rclone.conf"
    - "~/.config/mooniex/**"                # org tokens + OAuth (Run Inbox, YouTube)
    - "/home/driveup/.drive.env"            # Contabo Drive brokers' OAuth
    - "/home/photoup/.drive-photo.env"

# Per-task work dir. Every download, intermediate and output of a task lives
# under one folder named by the task id, and the task cannot close while it
# holds unfiled bytes. APPROVED by the CEO 2026-09-23 ("อนุมัติสร้าง ~/MoonieXHQ/Work/
# และเขียนกฎอย่างเข้มงวด"); the law is ~/MoonieXHQ/Work/RULES.md, IRON §55.
work_dir:
  root: "~/MoonieXHQ/Work"          # approved + created 2026-09-23 (HQ f7fe47a)
  rules: "~/MoonieXHQ/Work/RULES.md"
  big_download_gb: 1                # rule 9: before pulling more than this…
  keep_free_gb: 10                  # …leave at least this much free, else stop and report
  abandon_days: 14                  # D watcher: a folder whose task ended this long ago, owner alerted + LungNote Critical open, counts as Green for ALL_Rules_DiskHygiene (archive out/ + unsourced in/ first)
  layout: {in: "downloads + references", tmp: "intermediates", out: "deliverables"}
  on_close:
    tmp: delete
    in:  "delete if every file is re-downloadable from a URL in in/SOURCES.txt, else COLD"
    out: "move to the project's Assets folder (ALL_Rules_HQ_Filing), else COLD"

# Runners (flow_shoot, gen_loop, …) must not default their output under a NEVER path.
runner_dest:
  forbidden_defaults: ["~/Desktop/**", "~/Downloads/**", "~/Movies/**"]

# Git: no new media into a repo. Existing media stays (no history rewrite on a shared repo).
media_guard:
  max_bytes: 1048576                  # 1 MiB per added file
  extensions: [mp4, mov, webm, mkv, wav, mp3, m4a, png, jpg, jpeg, webp, gif, psd, zip, tar, gz]
  allow: []                           # repo-relative globs a project explicitly opts in

# Worker worktrees check out without the large committed media (measured at
# origin/main 2026-09-23: 3,371 tracked files / 912 MB; files > 256 KiB =
# 561 files / 843 MB — almost all of the weight is a small set of big
# files). A directory-level exclude (e.g. "docs/reports/**") was tried and
# rejected: git refuses `git add -A` for ANY new file under an excluded
# directory ("paths ... outside of your sparse-checkout definition" exit 1,
# reproduced on git 2.39.3) — 304 browser_operator tasks/30d write new files
# under docs/reports, so nearly every one of those commits would break.
# Excluding by EXACT PATH, only for files already this large, means a new
# file anywhere (a report, a screenshot) is always inside the sparse
# definition and `git add -A` just works. Extensions considered come from
# `media_guard.extensions` above — not duplicated here. A role that needs
# every byte (e.g. editing media directly) opts out per task.
sparse_worktree:
  min_bytes: 262144   # 256 KiB — only existing tracked files larger than this are excluded
  full_checkout_roles: [video_editor]
  keep_paths:                        # large media under these stays checked out (CTO 3d312dd6 review 2026-09-23: workers read skills' templates, prototypes and knowledge/ references outside their touches)
    - ".claude/skills/*"
    - "prototypes/*"
    - "knowledge/*"
