# Wiki content-split manifest — ADR 0013 §"Rollout" Phase 4.
#
# Consumed by scripts/wiki_split.py (--plan / --apply / --verify). This file
# is the move list; it does NOT replace config/wikis.yaml, which stays the
# registry the wiki tools (tools/wiki.py) actually serve.
#
# `moves`: each entry is one page moving from one wiki repo to another.
#   `from` / `to` are namespaces. `org` and `mooniex` are the two namespaces
#   registered in config/wikis.yaml — their on-disk paths come from there,
#   never hardcoded here. `lungnote` is NOT a wiki-tools namespace (see
#   `destinations.lungnote` below and TASK.md: "add it to the manifest as a
#   destination, NOT to config/wikis.yaml — that registry is for namespaces
#   the wiki tools serve; LungNote is not one").
#
# `destinations`: on-disk path (and link-rewrite metadata) for any `to`
# namespace that is NOT in config/wikis.yaml.
#
# `out_of_scope`: pages wiki_split.py must NEVER move (split by SECTION by
# the CTO in a later stage), but whose crossing links it MUST still rewrite
# in place — 85 of the 323 known cross-links point at IRON-RULES.md alone.

moves:
