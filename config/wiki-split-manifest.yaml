# Namespaces used above that are NOT in config/wikis.yaml. wiki_split.py
# resolves `org` and `mooniex` paths from config/wikis.yaml at runtime (never
# hardcoded); it resolves any `to:` namespace listed here from this section
# instead.
destinations:
  lungnote:
    path: /Users/gob/LungNote Projects/wikis
    # LungNote is not served by wiki_read()/wiki_write() (not a registered
    # wiki-tools namespace), so a crossing link INTO it omits the backticked
    # `ns:path` segment entirely — URL only. ADR 0013 §"Cross-wiki link
    # format": "LungNote-Wikis -> ... -> (no namespace; omit the backticked
    # part, the wiki tools do not serve it)".
    github_url_base: "https://github.com/PASAKON/LungNote-Wikis/blob/main/"
    namespace: null

# Pages that stay exactly where they are — split by SECTION by the CTO in a
# later stage, not by this tool. wiki_split.py must never move these, but
# MUST still rewrite crossing links found inside them (85 of the 323 known
# cross-links point at IRON-RULES.md alone).
out_of_scope:
  - IRON-RULES.md
  - CHEATSHEET.md
  - playbooks/ads.md
  - playbooks/balance-precheck.md
