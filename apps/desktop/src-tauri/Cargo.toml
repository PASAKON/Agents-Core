[package]
name = "mooniex-desktop"
version = "0.1.0"
description = "MoonieX control surface for people, agents, and distributed nodes"
authors = ["MoonieX"]
edition = "2021"

[lib]
name = "mooniex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
