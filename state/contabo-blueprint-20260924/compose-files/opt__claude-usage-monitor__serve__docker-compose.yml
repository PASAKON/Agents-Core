# Serves the Claude usage cache over HTTPS (behind the existing traefik) so the
# iPhone widget can fetch live data even when the Mac is off. Joins the existing
# `n8n_default` network and adds an additive, more-specific path router on the
# already-certificated webhook.mooniex.com host (does not disturb the existing
[LINE REDACTED BY CAPTURE FILTER]
services:
  claude-usage-serve:
    image: python:3.12-alpine
    container_name: claude-usage-serve
    restart: always
    command: ["python", "/srv/serve.py"]
    environment:
[LINE REDACTED BY CAPTURE FILTER]
    volumes:
      - /opt/claude-usage-monitor:/srv:ro   # usage.json + serve.py live here
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claude-usage.rule=Host(`webhook.mooniex.com`) && PathPrefix(`/claude-usage`)"
      - "traefik.http.routers.claude-usage.entrypoints=websecure"
      - "traefik.http.routers.claude-usage.tls=true"
      - "traefik.http.routers.claude-usage.tls.certresolver=mytlschallenge"
      - "traefik.http.services.claude-usage.loadbalancer.server.port=8088"

networks:
  n8n_default:
    external: true
